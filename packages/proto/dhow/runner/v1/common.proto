syntax = "proto3";

package dhow.runner.v1;

message RunnerRef {
  string runner_id = 1;
}

message LeaseRef {
  string lease_id = 1;
  int64 fencing_token = 2;
}

message LeaseControl {
  bool cancel_requested = 1;
  int32 lease_ttl_seconds = 2;
}

enum Isolation {
  ISOLATION_UNSPECIFIED = 0;
  ISOLATION_CONTAINER = 1;
  ISOLATION_GVISOR = 2;
}

enum AttemptResult {
  ATTEMPT_RESULT_UNSPECIFIED = 0;
  ATTEMPT_RESULT_SUCCEEDED = 1;
  ATTEMPT_RESULT_FAILED = 2;
  ATTEMPT_RESULT_CANCELED = 3;
  ATTEMPT_RESULT_TIMED_OUT = 4;
  ATTEMPT_RESULT_LOST = 5;
}

enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  FAILURE_REASON_STEP_FAILED = 1;
  FAILURE_REASON_OOM_KILLED = 2;
  FAILURE_REASON_PIDS_LIMIT_REACHED = 3;
  FAILURE_REASON_TIMED_OUT = 4;
  FAILURE_REASON_CANCELED = 5;
  FAILURE_REASON_IMAGE_PULL_FAILED = 6;
  FAILURE_REASON_SHELL_NOT_FOUND = 7;
  FAILURE_REASON_SPEC_REJECTED = 8;
  FAILURE_REASON_RESOURCE_REQUEST_EXCEEDS_RUNNER = 9;
  FAILURE_REASON_SANDBOX_FAILED = 10;
  FAILURE_REASON_RUNNER_DISK_FULL = 11;
  FAILURE_REASON_RUNNER_RESTARTED = 12;
  FAILURE_REASON_LEASE_LOST = 13;
  FAILURE_REASON_CHECKOUT_FAILED = 14;
  FAILURE_REASON_CHECKOUT_REF_MOVED = 15;
  FAILURE_REASON_HOST_KEY_MISMATCH = 16;
  FAILURE_REASON_CHECKOUT_DISK_FULL = 17;
  FAILURE_REASON_PLUGIN_INPUT_INVALID = 18;
  FAILURE_REASON_PLUGIN_MANIFEST_INVALID = 19;
  FAILURE_REASON_ARTIFACT_DOWNLOAD_FAILED = 20;
  FAILURE_REASON_ARTIFACT_UNSAFE = 21;
  FAILURE_REASON_ARTIFACT_UPLOAD_FAILED = 22;
  FAILURE_REASON_ARTIFACT_TOO_LARGE = 23;
  FAILURE_REASON_ARTIFACT_CONTAINS_SECRET = 24;
  FAILURE_REASON_DEPLOY_FAILED = 25;
  FAILURE_REASON_DEPLOY_ROLLED_BACK = 26;
  FAILURE_REASON_DEPLOY_HEALTH_FAILED = 27;
  FAILURE_REASON_DEPLOY_ROLLBACK_FAILED = 28;
  FAILURE_REASON_TARGET_LOCKED = 29;
  FAILURE_REASON_CURRENT_NOT_A_SYMLINK = 30;
  FAILURE_REASON_TARGET_HOST_UNREACHABLE = 31;
  FAILURE_REASON_TARGET_STATE_CORRUPT = 32;
  FAILURE_REASON_TARGET_CHECK_FAILED = 33;
}

enum RunnerFeature {
  RUNNER_FEATURE_UNSPECIFIED = 0;
  RUNNER_FEATURE_CHECKOUT = 1;
  RUNNER_FEATURE_PLUGINS = 2;
  RUNNER_FEATURE_ARTIFACTS = 3;
  RUNNER_FEATURE_CACHE = 4;
  RUNNER_FEATURE_REGISTRY_AUTH = 5;
  RUNNER_FEATURE_DEPLOY_TARGETS = 6;
}
