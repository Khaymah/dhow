syntax = "proto3";

package dhow.runner.v1;

import "dhow/runner/v1/common.proto";
import "google/protobuf/timestamp.proto";

message JobSpec {
  string image = 1;
  repeated Step steps = 2;
  map<string, string> env = 3;
  repeated SecretRef secrets = 4;
  Resources resources = 5;
  int32 timeout_seconds = 6;
  Network network = 7;
  Isolation isolation = 8;
  repeated string labels = 9;
  Checkout checkout = 10;
  repeated string derived_values = 11;
  repeated ArtifactUpload artifacts = 12;
  repeated ArtifactInput inputs = 13;
  Cache cache = 14;
  repeated RegistryAuth registry_auth = 15;
  repeated StepTarget targets = 16;
}

message StepTarget {
  int32 step_index = 1;
  string target_id = 2;
  int64 version = 3;
  string name = 4;
  string kind = 5;
  string user = 6;
  string deploy_path = 7;
  string release_id = 8;
  int32 keep_releases = 9;
  repeated TargetHost hosts = 10;
  TargetSettings settings = 11;
}

message TargetHost {
  string host_id = 1;
  string host = 2;
  int32 port = 3;
  string known_hosts_line = 4;
}

message TargetSettings {
  int32 batch_size = 1;
  int32 batch_pause_seconds = 2;
  string reload_command = 3;
  string pre_switch_command = 4;
  string post_switch_command = 5;
  repeated string shared = 6;
  string compose_project = 7;
  string compose_file = 8;
  bool allow_unsafe_compose = 9;
}

message RegistryAuth {
  string host = 1;
  string secret_name = 2;
}

message ArtifactUpload {
  string name = 1;
  repeated string paths = 2;
  int64 max_bytes = 3;
  int64 retention_seconds = 4;
}

message ArtifactInput {
  string name = 1;
  string digest = 2;
  int64 size_bytes = 3;
  string download_token = 4;
}

message CacheHash {
  repeated string patterns = 1;
}

message Cache {
  string key_expression = 1;
  repeated CacheHash hashes = 2;
  repeated string paths = 3;
  bool read_only = 4;
  int64 max_bytes = 5;
}

message Step {
  string name = 1;
  string run = 2;
  map<string, string> env = 3;
  bool mutating = 4;
  int32 timeout_seconds = 5;
  string id = 6;
  Plugin plugin = 7;
}

message Plugin {
  string image = 1;
  map<string, string> inputs = 2;
}

enum CheckoutTransport {
  CHECKOUT_TRANSPORT_UNSPECIFIED = 0;
  CHECKOUT_TRANSPORT_HTTPS = 1;
  CHECKOUT_TRANSPORT_SSH = 2;
}

message Checkout {
  string repository_url = 1;
  string ref = 2;
  string sha = 3;
  CheckoutTransport transport = 4;
  string credential_secret = 5;
  string known_host = 6;
  int32 depth = 7;
}

message SecretRef {
  string name = 1;
  oneof target {
    string as_env = 2;
    string as_file = 3;
  }
  repeated int32 step_indexes = 4;
}

message Resources {
  int64 cpu_millis = 1;
  int64 memory_bytes = 2;
  int64 pids = 3;
  int64 disk_bytes = 4;
}

message Network {
  repeated string egress = 1;
  repeated string exact_endpoints = 2;
}

enum HpkeKem {
  HPKE_KEM_UNSPECIFIED = 0;
  HPKE_KEM_MLKEM768_X25519 = 1;
}

message SealedSecrets {
  HpkeKem kem = 1;
  bytes enc = 2;
  bytes ciphertext = 3;
}

message SecretValue {
  string name = 1;
  bytes value = 2;
}

message SecretBundle {
  repeated SecretValue secrets = 1;
}

message LeaseGrant {
  string lease_id = 1;
  string attempt_id = 2;
  string job_id = 3;
  string organization_id = 4;
  string runner_id = 5;
  int64 fencing_token = 6;
  int32 lease_ttl_seconds = 7;
  google.protobuf.Timestamp issued_at = 8;
  JobSpec spec = 9;
}

message SignedLeaseGrant {
  bytes grant_bytes = 1;
  bytes signature = 2;
  int32 key_version = 3;
}
