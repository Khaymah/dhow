syntax = "proto3";

package dhow.runner.v1;

import "dhow/runner/v1/common.proto";

service ReleaseService {
  rpc Report(ReleaseServiceReportRequest) returns (ReleaseServiceReportResponse);
}

enum DeployEventKind {
  DEPLOY_EVENT_KIND_UNSPECIFIED = 0;
  DEPLOY_EVENT_KIND_RELEASE_STARTED = 1;
  DEPLOY_EVENT_KIND_UPLOADED = 2;
  DEPLOY_EVENT_KIND_SWITCHED = 3;
  DEPLOY_EVENT_KIND_HEALTH = 4;
  DEPLOY_EVENT_KIND_VERIFIED = 5;
  DEPLOY_EVENT_KIND_ROLLED_BACK = 6;
  DEPLOY_EVENT_KIND_ROLLBACK_FAILED = 7;
  DEPLOY_EVENT_KIND_PRUNED = 8;
  DEPLOY_EVENT_KIND_BATCH_PASSED = 9;
  DEPLOY_EVENT_KIND_FAILED = 10;
  DEPLOY_EVENT_KIND_SKIPPED = 11;
  DEPLOY_EVENT_KIND_CHECKED = 12;
}

message DeployHealth {
  int32 attempts = 1;
  bool passed = 2;
  int32 last_status = 3;
  string last_error = 4;
  int64 duration_ms = 5;
  int32 stable_checks = 6;
}

message DeployEvent {
  DeployEventKind kind = 1;
  string host_id = 2;
  int32 batch = 3;
  string release_id = 4;
  string previous_release_id = 5;
  string mode = 6;
  string reason = 7;
  string message = 8;
  DeployHealth health = 9;
  string current_release_id = 10;
  string verified_release_id = 11;
  int64 free_bytes = 12;
  bool locked = 13;
}

message ReleaseServiceReportRequest {
  LeaseRef lease = 1;
  int32 step_index = 2;
  repeated DeployEvent events = 3;
}

message ReleaseServiceReportResponse {
  int32 accepted = 1;
}
