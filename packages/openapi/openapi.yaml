      tags: [targets]
      summary: Create a deploy target
      description: >-
        Needs `environment.manage` on the project and a fresh `CurrentFactor`. A target has 1 to 10 hosts in deploy order. A host key is
        pinned later, per host, by `confirm-host-key`; a target with an unpinned host is not `Ready`. `KeySecretName` names a secret of this
        environment (422 `TARGET_KEY_NOT_FOUND` if it is missing); leave it out and use `generate-key` instead. A bad field is 422
        `VALIDATION_FAILED`, a forbidden path is 422 `DEPLOY_PATH_INVALID`, an address Dhow never connects to is 422
        `TARGET_HOST_BLOCKED`, a name used twice in the environment is 409 `TARGET_EXISTS`, and the same host, port and path in another
        target of the organization is 409 `TARGET_DUPLICATE`.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
      requestBody:
        required: true
        content:
          application/json:
