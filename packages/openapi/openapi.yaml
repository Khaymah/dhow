        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/secrets/{secretName}:
    put:
      operationId: putOrganizationSecret
      tags: [secrets]
      summary: Create a secret of the organization, or write a new version
      description: >-
        Needs `org.secret.manage`. Creates the secret or a new version of it. The value is UTF-8 without NUL, 8 bytes
        (`SECRET_TOO_SHORT`) to 32 KiB (`SECRET_TOO_LARGE`), and is never returned. Names are unique in the
        scope whatever their case, and names that start with `DHOW_` answer `SECRET_NAME_RESERVED`. The
        value of a version older than the last five, or replaced more than 30 days ago, is erased.
        `Visibility` and `ProjectIds` choose the projects that may use it.
        `AvailableToPullRequests` lets runs of pull requests from the same repository use it.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/SecretName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSecretRequest"
      responses:
        "200":
          description: The secret, without its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/secrets/{secretName}/remove:
    post:
      operationId: removeOrganizationSecret
      tags: [secrets]
      summary: Remove a secret of the organization
      description: >-
        Needs `org.secret.manage`. Marks the secret deleted and erases the values of all its versions in the same
        transaction. The name can be used again.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
