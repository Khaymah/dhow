            The token, `dhow_pat_` followed by 43 base64url characters. Send it as `Authorization: Bearer <value>`.
            Shown only in this response.
    CreatedApiTokenResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/CreatedApiToken"
    ThemeColors:
      type: object
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 7
      description: One `#rrggbb` color for every theme token, keyed by the token name (`canvas`, `t1`, `a1`, ...).
    CustomTheme:
      type: object
      additionalProperties: false
      required: [Id, Name, Colors]
      properties:
        Id:
          type: string
          maxLength: 40
        Name:
          type: string
          maxLength: 40
        Colors:
          $ref: "#/components/schemas/ThemeColors"
    SavePreferencesRequest:
      type: object
      additionalProperties: false
      required: [Locale, ThemeId, CustomThemes, OrganizationId]
      properties:
        Locale:
          $ref: "#/components/schemas/Locale"
        ThemeId:
          type: string
          maxLength: 40
        CustomThemes:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CustomTheme"
        OrganizationId:
          type: string
          format: uuid
          nullable: true
    Preferences:
      type: object
      additionalProperties: false
      required: [Locale, ThemeId, CustomThemes, OrganizationId, Saved]
      properties:
        Locale:
          $ref: "#/components/schemas/Locale"
        ThemeId:
          type: string
        CustomThemes:
          type: array
          items:
            $ref: "#/components/schemas/CustomTheme"
        OrganizationId:
          type: string
          format: uuid
          nullable: true
        Saved:
          type: boolean
          description: False until the first save.
        UpdatedAt:
          type: string
          format: date-time
          nullable: true
    PreferencesResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Preferences"
    JobState:
      type: string
      enum: [queued, leased, running, succeeded, failed, canceled, timed_out, lost]
    JobAttemptState:
      type: string
      enum: [leased, running, succeeded, failed, canceled, timed_out, lost]
    JobStepState:
      type: string
      enum: [running, succeeded, failed, interrupted]
    JobIsolation:
      type: string
      enum: [container, gvisor]
    JobQueuedReason:
      type: string
      enum: [NO_MATCHING_RUNNER]
    JobStep:
      type: object
      additionalProperties: false
      required: [Name, Run]
      properties:
        Name:
          type: string
          maxLength: 100
        Run:
          type: string
          description: A shell script, run with `/bin/sh -e -s`.
        Env:
          type: object
          additionalProperties:
            type: string
        Mutating:
          type: boolean
          description: The step changes a deploy target, so the job is never retried automatically once it began.
        TimeoutSeconds:
          type: integer
          minimum: 0
          description: Zero means the job timeout.
    JobSecretRef:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          maxLength: 64
        AsEnv:
          type: string
          description: The environment variable that carries the value. Exactly one of AsEnv and AsFile.
        AsFile:
          type: string
          description: A file name under /run/dhow/secrets. Exactly one of AsEnv and AsFile.
        Steps:
          type: array
          items:
            type: integer
            minimum: 0
          description: The step indexes that see the secret. Empty means every step.
    JobResources:
      type: object
      additionalProperties: false
      properties:
        CpuMillis:
          type: integer
          format: int64
        MemoryBytes:
          type: integer
          format: int64
        Pids:
          type: integer
          format: int64
        DiskBytes:
          type: integer
          format: int64
    JobNetwork:
      type: object
      additionalProperties: false
      properties:
        Egress:
          type: array
          maxItems: 64
          items:
            type: string
          description: Hosts the job may reach through the runner proxy, as `host`, `*.host` or `host:port`. IP literals are refused.
    JobSpec:
      type: object
      additionalProperties: false
      required: [Image, Steps]
      properties:
        Image:
          type: string
          description: An image reference pinned by digest (`name@sha256:...`). A name without a registry host is completed the way Docker does it, so `node:22@sha256:...` becomes `docker.io/library/node:22@sha256:...`.
        Steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/JobStep"
        Env:
          type: object
          additionalProperties:
            type: string
          description: >-
            Plain environment for every step. Names that start with `DHOW_` are reserved. Every member who can read the job
            sees these values, viewers included, so never put a credential here: reference it from Secrets. In a job of a
            pipeline run, a value that an expression made (a `needs` output, a `git` value) reads `[REDACTED]` here and in
            step environments; the runner still gets the value.
        Secrets:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/JobSecretRef"
        Resources:
          $ref: "#/components/schemas/JobResources"
        TimeoutSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Zero means one hour.
        Network:
          $ref: "#/components/schemas/JobNetwork"
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Labels:
          type: array
          maxItems: 32
          items:
            type: string
          description: Every label must be on the runner, including the reserved `dhow.` capability labels.
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [Name, Spec]
      properties:
        Name:
          type: string
          maxLength: 100
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Priority:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Higher runs first among queued jobs.
        MaxInfraRetries:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
          description: How many times a job that lost its runner before any mutating step is queued again.
    Job:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, Name, State, Labels, Isolation, Priority, Image, SpecDigest, AttemptCount,
                 MaxInfraRetries, QueuedAt, QueueDeadline, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        Name:
          type: string
        State:
          $ref: "#/components/schemas/JobState"
        FailureReason:
          type: string
          description: Why the job ended the way it did, for example `QUEUE_TIMEOUT` or `LOST_AFTER_MUTATION`.
        QueuedReason:
          $ref: "#/components/schemas/JobQueuedReason"
        Labels:
          type: array
          items:
            type: string
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Priority:
          type: integer
        Image:
          type: string
        SpecDigest:
          type: string
          description: Hex SHA-256 of the normalized spec.
        AttemptCount:
          type: integer
          minimum: 0
        MaxInfraRetries:
          type: integer
          minimum: 0
        QueuedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        Deadline:
          type: string
          format: date-time
        QueueDeadline:
          type: string
          format: date-time
        CancelRequestedAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        CreatedByUserId:
          type: string
          format: uuid
          nullable: true
          description: Empty for a job that a webhook's run made.
    JobAttemptStep:
      type: object
      additionalProperties: false
      required: [Index, Name, Mutating, State, StartedAt]
      properties:
        Index:
          type: integer
          minimum: 0
        Name:
          type: string
        Mutating:
          type: boolean
        State:
          $ref: "#/components/schemas/JobStepState"
        ExitCode:
          type: integer
        FailureReason:
          type: string
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
    JobAttempt:
      type: object
      additionalProperties: false
      required: [Id, Number, RunnerId, FencingToken, State, LeasedAt, Steps]
      properties:
        Id:
          type: string
          format: uuid
        Number:
          type: integer
          minimum: 1
        RunnerId:
          type: string
          format: uuid
        RunnerName:
          type: string
          description: The runner's name, when the runner still exists.
        FencingToken:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The fencing token of the attempt's lease. Every attempt gets a larger one than the attempts before it, and
            the server refuses any call from a runner that holds an older token.
        State:
          $ref: "#/components/schemas/JobAttemptState"
        FailureReason:
          type: string
        ExitCode:
          type: integer
        LeasedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        MutationStartedAt:
          type: string
          format: date-time
        Steps:
          type: array
          items:
            $ref: "#/components/schemas/JobAttemptStep"
    JobRun:
      type: object
      additionalProperties: false
      required: [ProjectId, ProjectName, RunId, RunNumber, Kind]
      description: The pipeline run this job belongs to. Absent for a job that no run made.
      properties:
        Kind:
          $ref: "#/components/schemas/RunJobKind"
        ProjectId:
          type: string
          format: uuid
        ProjectName:
          type: string
        RunId:
          type: string
          format: uuid
        RunNumber:
          type: integer
          format: int64
          minimum: 1
    JobDetail:
      type: object
      additionalProperties: false
      required: [Job, Spec, Attempts]
      properties:
        Job:
          $ref: "#/components/schemas/Job"
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Run:
          $ref: "#/components/schemas/JobRun"
        Attempts:
          type: array
          items:
            $ref: "#/components/schemas/JobAttempt"
    JobResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Job"
    JobDetailResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/JobDetail"
    JobLogStream:
      type: string
      enum: [stdout, stderr, system]
    JobLogChunk:
      type: object
      additionalProperties: false
      required: [Seq, Stream, CreatedAt, Text]
      properties:
        Seq:
          type: integer
          format: int64
          minimum: 1
        Stream:
          $ref: "#/components/schemas/JobLogStream"
        StepIndex:
          type: integer
          minimum: 0
        EmittedAt:
          type: string
          format: date-time
          description: The runner's clock, for display only.
        CreatedAt:
          type: string
          format: date-time
        Text:
          type: string
          description: >-
            The bytes as UTF-8 with invalid bytes replaced by U+FFFD. Render it as text, never as HTML, each line
            with `dir="auto"`.
    JobLogStatus:
      type: object
      additionalProperties: false
      required: [Attempt, State, Truncated]
      properties:
        Attempt:
          type: integer
          minimum: 1
        State:
          $ref: "#/components/schemas/JobAttemptState"
        Truncated:
          type: boolean
    JobLogPage:
      type: object
      additionalProperties: false
      required: [Attempt, AttemptId, State, LastSeq, Truncated, Chunks]
      properties:
        Attempt:
          type: integer
          minimum: 1
        AttemptId:
          type: string
          format: uuid
        State:
          $ref: "#/components/schemas/JobAttemptState"
        LastSeq:
          type: integer
          format: int64
          minimum: 0
          description: The highest sequence number the attempt has reached so far.
        Truncated:
          type: boolean
          description: The log reached `DHOW_JOB_LOG_MAX_BYTES` and later output was dropped.
        NextSeq:
          type: integer
          format: int64
          minimum: 1
          description: Pass it as `FromSeq` to read on. Absent when this page reached the end so far.
        Chunks:
          type: array
          items:
            $ref: "#/components/schemas/JobLogChunk"
    JobLogPageResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/JobLogPage"
    JobListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Job"
    ProjectState:
      type: string
      enum: [active, archived]
    ForkPolicy:
      type: string
      enum: [approval, automatic]
      description: >-
        `approval`: a pull request from a fork waits until a Maintainer or above approves it. `automatic`: it runs at
        once, still without secrets or environments.
    ForkCacheRestore:
      type: string
      enum: [none, default_branch]
      description: >-
        What a run from a fork may restore from the cache. `none` (the default): nothing. `default_branch`: the cache of
        the default branch only, never an entry written by a job that got a secret.
    Project:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, Slug, Name, PipelinePath, ForkPolicy, ForkCacheRestore, State, RepositoryLinked, CreatedAt, UpdatedAt]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        Slug:
          type: string
        Name:
          type: string
        PipelinePath:
          type: string
          description: Where the pipeline file lives in the repository, relative to its root.
        ForkPolicy:
          $ref: "#/components/schemas/ForkPolicy"
        ForkCacheRestore:
          $ref: "#/components/schemas/ForkCacheRestore"
        State:
          $ref: "#/components/schemas/ProjectState"
        RepositoryLinked:
          type: boolean
          description: A repository is linked, so `getRepository` answers it instead of 404 `REPOSITORY_NOT_LINKED`.
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        ArchivedAt:
          type: string
          format: date-time
        CallerRole:
          $ref: "#/components/schemas/Role"
          description: >-
            The caller's role on this project after its role bindings, so a client can hide what the caller may not do.
            Only in the answers about one project (read, change, archive), not in the list.
    ProjectResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Project"
    ProjectListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [Name, Slug]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 100
        Slug:
          type: string
          minLength: 1
          maxLength: 63
          description: Lowercase letters, digits and single hyphens.
        PipelinePath:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Defaults to `.dhow.yml`. A relative path that ends in `.yml` or `.yaml`, without `..`, a leading slash or a
            backslash.
        ForkPolicy:
          $ref: "#/components/schemas/ForkPolicy"
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 100
        PipelinePath:
          type: string
          minLength: 1
          maxLength: 255
        ForkPolicy:
          $ref: "#/components/schemas/ForkPolicy"
        ForkCacheRestore:
          $ref: "#/components/schemas/ForkCacheRestore"
    EnvironmentRefKind:
      type: string
      enum: [branch, tag]
    EnvironmentRef:
      type: object
      additionalProperties: false
      required: [Kind, Pattern]
      properties:
        Kind:
          $ref: "#/components/schemas/EnvironmentRefKind"
        Pattern:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            A glob on the short branch or tag name (`Kind` says which): `*` and `?` within one part between slashes,
            `**` alone for any number of parts, none included, so `release/**` also matches `release`. Without `..`,
            `//`, a leading or trailing slash, spaces, invisible characters, `~`, `^`, `:`, brackets or braces, and
            never a full name that starts with `refs/`, `heads/` or `tags/`.
    EnvironmentReviewers:
      type: object
      additionalProperties: false
      required: [UserIds, TeamIds]
      properties:
        UserIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        TeamIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    EnvironmentReviewersView:
      type: object
      additionalProperties: false
      required: [UserIds, TeamIds, UserCount, TeamCount, IdsShown]
      description: >-
        The ids are shown only to a caller who may manage the environment, over a session. Everyone else, and every API
        token, gets empty lists and the counts.
      properties:
        UserIds:
          type: array
          items:
            type: string
            format: uuid
        TeamIds:
          type: array
          items:
            type: string
            format: uuid
        UserCount:
          type: integer
          minimum: 0
        TeamCount:
          type: integer
          minimum: 0
        IdsShown:
          type: boolean
    EnvironmentIsolation:
      type: string
      enum: [container]
    EnvironmentRules:
      type: object
      additionalProperties: false
      required:
        - AllowedRefs
        - AllowPullRequests
        - Reviewers
        - RequiredApprovals
        - AllowSelfApproval
        - WaitMinutes
        - ApprovalTimeoutHours
        - RequirePinnedImages
        - AllowedPlugins
        - RequiredIsolation
        - AllowAdminBypass
        - SupersedePending
        - AllowExtraDeployEgress
      properties:
        AllowedRefs:
          type: array
          maxItems: 50
          description: The branches and tags that may deploy here. Empty means nothing deploys. Never bypassed.
          items:
            $ref: "#/components/schemas/EnvironmentRef"
        AllowPullRequests:
          type: boolean
          description: Pull requests from the same repository may deploy here. Pull requests from forks never do.
        Reviewers:
          $ref: "#/components/schemas/EnvironmentReviewersView"
        RequiredApprovals:
          type: integer
          minimum: 1
          maximum: 1
          description: One reviewer in Community.
        AllowSelfApproval:
          type: boolean
          description: >-
            The person who started the run may approve it. Off by default; only `environment.manage` turns it on, for
            a team of one.
        WaitMinutes:
          type: integer
          minimum: 0
          maximum: 43200
        ApprovalTimeoutHours:
          type: integer
          minimum: 1
          maximum: 720
        RequirePinnedImages:
          type: boolean
          description: Every image is pinned by digest in the pipeline file itself.
        AllowedPlugins:
          type: array
          maxItems: 50
          description: Image name prefixes of the plugins allowed here. Empty allows any plugin.
          items:
            type: string
            minLength: 1
            maxLength: 256
        RequiredIsolation:
          $ref: "#/components/schemas/EnvironmentIsolation"
        AllowAdminBypass:
          type: boolean
          description: An Admin may skip the reviewers and the timer, with a reason and a second factor.
        SupersedePending:
          type: boolean
          description: A newer run on the same ref replaces an older run still waiting for approval.
        AllowExtraDeployEgress:
          type: boolean
          description: >-
            A job that deploys to a target may also reach hosts its pipeline file lists under `network.egress`. Off by
            default: such a job reaches the hosts of its target and nothing else.
    EnvironmentRulesInput:
      type: object
      additionalProperties: false
      description: Any subset of the rules. A field left out keeps its current value, or its default on create.
      properties:
        AllowedRefs:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/EnvironmentRef"
        AllowPullRequests:
          type: boolean
        Reviewers:
          $ref: "#/components/schemas/EnvironmentReviewers"
        RequiredApprovals:
          type: integer
          minimum: 1
          maximum: 1
        AllowSelfApproval:
          type: boolean
        WaitMinutes:
          type: integer
          minimum: 0
          maximum: 43200
        ApprovalTimeoutHours:
          type: integer
          minimum: 1
          maximum: 720
        RequirePinnedImages:
          type: boolean
        AllowedPlugins:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 256
        RequiredIsolation:
          $ref: "#/components/schemas/EnvironmentIsolation"
        AllowAdminBypass:
          type: boolean
        SupersedePending:
          type: boolean
        AllowExtraDeployEgress:
          type: boolean
    Environment:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, ProjectId, Name, Description, Version, RuleVersion, Rules, Paused, CreatedAt, UpdatedAt]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        ProjectId:
          type: string
          format: uuid
        Name:
          type: string
        Description:
          type: string
        Version:
          type: integer
          format: int64
          description: Rises with every change. Send it back to change the environment.
        RuleVersion:
          type: integer
          format: int64
          description: Rises with every change to the rules, the reviewers or the pause. Approvals are bound to it.
        Rules:
          $ref: "#/components/schemas/EnvironmentRules"
        Paused:
          type: boolean
        PausedAt:
          type: string
          format: date-time
        PausedByUserId:
          type: string
          format: uuid
        PausedReason:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
    EnvironmentResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Environment"
    EnvironmentListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Environment"
    DeployTargetKind:
      type: string
      enum: [ssh, compose]
    DeployTargetRolling:
      type: object
      additionalProperties: false
      properties:
        BatchSize:
          type: integer
          minimum: 1
          maximum: 10
          description: How many hosts switch together. At most the number of hosts of the target.
        BatchPauseSeconds:
          type: integer
          minimum: 0
          maximum: 600
    DeployTargetSshSettings:
      type: object
      additionalProperties: false
      properties:
        ReloadCommand:
          type: string
          maxLength: 1024
          description: A single line that runs on the host after the switch. Written by an admin only.
        PreSwitchCommand:
          type: string
          maxLength: 1024
        PostSwitchCommand:
          type: string
          maxLength: 1024
        Shared:
          type: array
          maxItems: 20
          description: Names of files and folders kept in `shared/` and linked into each release.
          items:
            type: string
            pattern: "^[A-Za-z0-9.][A-Za-z0-9._-]{0,63}$"
    DeployTargetComposeSettings:
      type: object
      additionalProperties: false
      properties:
        ProjectName:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
        ComposeFile:
          type: string
          maxLength: 100
          description: A relative path inside the release. Defaults to `compose.yaml`.
        AllowUnsafeCompose:
          type: boolean
    DeployTargetSettings:
      type: object
      additionalProperties: false
      description: >-
        Only the block of the target's kind may be sent: `Ssh` for `ssh`, `Compose` for `compose`. At most 4 KiB.
      properties:
        Rolling:
          $ref: "#/components/schemas/DeployTargetRolling"
        AllowRoot:
          type: boolean
          description: Lets `Username` be `root`. A warning, not a recommendation.
        Ssh:
          $ref: "#/components/schemas/DeployTargetSshSettings"
        Compose:
          $ref: "#/components/schemas/DeployTargetComposeSettings"
    DeployTargetNotReady:
      type: string
      enum: [host_key_unconfirmed, key_missing]
    DeployTargetHost:
      type: object
      additionalProperties: false
      required: [Id, Position, Host, Port, KeyPinned]
      properties:
        Id:
          type: string
          format: uuid
        Position:
          type: integer
          minimum: 1
          maximum: 10
          description: The deploy order, from 1.
        Host:
          type: string
          description: A DNS name or an IP address.
        Port:
          type: integer
          minimum: 1
          maximum: 65535
        KeyPinned:
          type: boolean
        HostKeyFingerprint:
          type: string
          description: The `SHA256:` fingerprint of the pinned host key.
        HostKeyConfirmedAt:
          type: string
          format: date-time
        HostKeyConfirmedByUserId:
          type: string
          format: uuid
        PendingHostKeyFingerprint:
          type: string
          description: The `SHA256:` fingerprint of a key that was fetched or pasted and is not confirmed yet.
    DeployTarget:
      type: object
      additionalProperties: false
      required:
        - Id
        - EnvironmentId
        - Name
        - Kind
        - Username
        - DeployPath
        - KeepReleases
        - Settings
        - AllowedImages
        - Hosts
        - Ready
        - NotReady
        - Version
        - CreatedAt
        - UpdatedAt
      properties:
        Id:
          type: string
          format: uuid
        EnvironmentId:
          type: string
          format: uuid
        Name:
          type: string
        Kind:
          $ref: "#/components/schemas/DeployTargetKind"
        Username:
          type: string
        KeySecretName:
          type: string
          description: The name of the environment secret that holds the private key. Never its value.
        PublicKey:
          type: string
          description: The public half of the key Dhow made. Put it in `authorized_keys` on every host.
        DeployPath:
          type: string
        KeepReleases:
          type: integer
          minimum: 2
          maximum: 50
        Settings:
          $ref: "#/components/schemas/DeployTargetSettings"
        AllowedImages:
          type: array
          maxItems: 10
          items:
            type: string
        Hosts:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DeployTargetHost"
        Ready:
          type: boolean
          description: Every host has a pinned key and the deploy key is set.
        NotReady:
          type: array
          items:
            $ref: "#/components/schemas/DeployTargetNotReady"
        Version:
          type: integer
          format: int64
          description: Rises with every change that a deploy depends on. Send it back to change the target.
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
    DeployTargetHostCheck:
      type: object
      additionalProperties: false
      required: [HostId, Position, Host, Port, Checked, Locked, Repaired]
      properties:
        HostId:
          type: string
          format: uuid
        Position:
          type: integer
        Host:
          type: string
        Port:
          type: integer
        Checked:
          type: boolean
        Reason:
          type: string
          enum: [ok, host_key_mismatch, unreachable, auth_failed, path_missing, current_not_symlink, state_corrupt, disk_low, locked, diverged]
        Message:
          type: string
        CurrentReleaseId:
          type: string
        VerifiedReleaseId:
          type: string
        FreeBytes:
          type: integer
          format: int64
        Locked:
          type: boolean
        Repaired:
          type: boolean
        CheckedAt:
          type: string
          format: date-time
    DeployTargetCheck:
      type: object
      additionalProperties: false
      required: [Hosts]
      properties:
        Hosts:
          type: array
          items:
            $ref: "#/components/schemas/DeployTargetHostCheck"
    DeployTargetCheckResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/DeployTargetCheck"
    DeployTargetCheckStarted:
      type: object
      additionalProperties: false
      required: [RunId, RunNumber]
      properties:
        RunId:
          type: string
          format: uuid
        RunNumber:
          type: integer
          format: int64
    DeployTargetCheckStartedResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/DeployTargetCheckStarted"
    DeployTargetResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/DeployTarget"
    DeployTargetListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/DeployTarget"
    DeployTargetHostInput:
      type: object
      additionalProperties: false
      required: [Host]
      properties:
        Host:
          type: string
          minLength: 1
          maxLength: 253
        Port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Defaults to 22.
    CreateDeployTargetRequest:
      type: object
      additionalProperties: false
      required: [Name, Kind, Username, DeployPath, Hosts, CurrentFactor]
      properties:
        Name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        Kind:
          $ref: "#/components/schemas/DeployTargetKind"
        Username:
          type: string
          maxLength: 32
        KeySecretName:
          type: string
          maxLength: 64
        DeployPath:
          type: string
          maxLength: 201
        KeepReleases:
          type: integer
          minimum: 2
          maximum: 50
        Settings:
          $ref: "#/components/schemas/DeployTargetSettings"
        AllowedImages:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 256
        Hosts:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/DeployTargetHostInput"
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    UpdateDeployTargetRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
        Username:
          type: string
          maxLength: 32
        KeySecretName:
          type: string
          maxLength: 64
        DeployPath:
          type: string
          maxLength: 201
        KeepReleases:
          type: integer
          minimum: 2
          maximum: 50
        Settings:
          $ref: "#/components/schemas/DeployTargetSettings"
        AllowedImages:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 256
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    AddDeployTargetHostRequest:
      type: object
      additionalProperties: false
      required: [Version, Host, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
        Host:
          type: string
          minLength: 1
          maxLength: 253
        Port:
          type: integer
          minimum: 1
          maximum: 65535
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    UpdateDeployTargetHostRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
        Host:
          type: string
          minLength: 1
          maxLength: 253
        Port:
          type: integer
          minimum: 1
          maximum: 65535
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    RemoveDeployTargetHostRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    ReorderDeployTargetHostsRequest:
      type: object
      additionalProperties: false
      required: [Version, HostIds, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
        HostIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uuid
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    SetDeployTargetPendingHostKeyRequest:
      type: object
      additionalProperties: false
      required: [HostKey]
      properties:
        HostKey:
          type: string
          minLength: 1
          maxLength: 8192
    ConfirmDeployTargetHostKeyRequest:
      type: object
      additionalProperties: false
      required: [Fingerprint, CurrentFactor]
      properties:
        Fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    DeploymentApprovalState:
      type: string
      enum: [pending, approved, rejected, expired, superseded, canceled, bypassed]
    DeploymentApproval:
      type: object
      additionalProperties: false
      required: [Id, ProjectId, EnvironmentId, Environment, RunId, RunNumber, Ref, Round, RuleVersion, State, ExpiresAt, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        ProjectId:
          type: string
          format: uuid
        EnvironmentId:
          type: string
          format: uuid
        Environment:
          type: string
        RunId:
          type: string
          format: uuid
        RunNumber:
          type: integer
          format: int64
        Ref:
          type: string
        Round:
          type: integer
          description: A rerun of the failed jobs starts a new round, which needs a new approval.
        RuleVersion:
          type: integer
          format: int64
        State:
          $ref: "#/components/schemas/DeploymentApprovalState"
        ExpiresAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        DecidedByUserId:
          type: string
          format: uuid
        DecidedAt:
          type: string
          format: date-time
        FactorKind:
          type: string
          description: The kind of second factor used for the decision (`totp`, `recovery_code` or `passkey`), never its value.
        Comment:
          type: string
        BypassReason:
          type: string
        SupersededByRunId:
          type: string
          format: uuid
    DeploymentApprovalResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/DeploymentApproval"
    DeploymentApprovalListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/DeploymentApproval"
    DecideDeploymentRequest:
      type: object
      additionalProperties: false
      required: [CurrentFactor]
      properties:
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Comment:
          type: string
          maxLength: 1024
    BypassDeploymentRequest:
      type: object
      additionalProperties: false
      required: [CurrentFactor, Reason]
      properties:
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Reason:
          type: string
          minLength: 1
          maxLength: 1024
    DeploymentState:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    Deployment:
      type: object
      additionalProperties: false
      required: [Id, RunId, RunNumber, RunJobId, JobId, JobKey, Ref, RuleVersion, State, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        RunId:
          type: string
          format: uuid
        RunNumber:
          type: integer
          format: int64
        RunJobId:
          type: string
          format: uuid
        JobId:
          type: string
          format: uuid
          description: The job that ran the deploy. Its logs are under `/jobs/{jobId}`.
        JobKey:
          type: string
        Ref:
          type: string
        Sha:
          type: string
        RuleVersion:
          type: integer
          format: int64
          description: The `RuleVersion` of the environment when the job passed the gate.
        State:
          $ref: "#/components/schemas/DeploymentState"
        CreatedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
    DeploymentListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Deployment"
    CreateEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [Name, CurrentFactor]
      properties:
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          description: The name a job writes in `environment:`. Lowercase letters, digits, `_` and `-`.
        Description:
          type: string
          maxLength: 500
        Rules:
          $ref: "#/components/schemas/EnvironmentRulesInput"
    UpdateEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 1
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Description:
          type: string
          maxLength: 500
        Rules:
          $ref: "#/components/schemas/EnvironmentRulesInput"
    PauseEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [Reason]
      properties:
        Reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Shown to everyone who can read the project, and kept in the audit log.
    RunState:
      type: string
      enum: [awaiting_approval, pending, queued, running, succeeded, failed, canceled, skipped]
      description: >-
        `awaiting_approval`: a pull request from a fork waits for a Maintainer. `pending`: the server reads the pipeline
        file and pins its images. `queued`: the run waits for an older run of its concurrency group. `skipped`: the
        pipeline file is missing or does not run on this trigger.
    RunTrigger:
      type: string
      enum: [push, tag, pull_request, manual, api]
    RunJobKind:
      type: string
      enum: [job, discovery]
      description: >-
        `discovery`: the job Dhow adds to read the pipeline file of a generic repository. Its `Name` is in English, so a
        client names it from the kind.
    RunJobState:
      type: string
      enum: [waiting, active, succeeded, failed, canceled, skipped]
    RunJobGate:
      type: string
      enum: [approval, timer, paused, environment_busy, target_busy]
      description: >-
        Why a `waiting` job on an environment does not start yet: it waits for a reviewer, for the wait timer, for the
        environment to be resumed, for another run that holds the environment, or (`target_busy`) for another job of the
        same run that is deploying to the same target.
    RunIssue:
      type: object
      additionalProperties: false
      required: [Code, Severity, Path, Line, Column, Message]
      properties:
        Code:
          type: string
          description: A stable code such as `UNKNOWN_KEY` or `IMAGE_NOT_PINNED`, the same that `dhow lint` prints.
        Severity:
          type: string
          enum: [error, warning]
        Path:
          type: string
        Line:
          type: integer
          minimum: 0
        Column:
          type: integer
          minimum: 0
        Message:
          type: string
    RunImagePin:
      type: object
      additionalProperties: false
      required: [Image, Pinned]
      properties:
        Image:
          type: string
          description: The image as the pipeline file names it, by tag.
        Pinned:
          type: string
          description: The same image by digest, as every job and every rerun of this run pulls it.
    Run:
      type: object
      additionalProperties: false
      required: [Id, ProjectId, Number, Trigger, Ref, IsFork, State, DefinitionPath, CreatedAt, UpdatedAt]
      properties:
        Id:
          type: string
          format: uuid
        ProjectId:
          type: string
          format: uuid
        Number:
          type: integer
          format: int64
          minimum: 1
        Trigger:
          $ref: "#/components/schemas/RunTrigger"
        Ref:
          type: string
        Sha:
          type: string
        BaseRef:
          type: string
        BaseSha:
          type: string
        IsFork:
          type: boolean
        PrNumber:
          type: integer
        Actor:
          type: string
        State:
          $ref: "#/components/schemas/RunState"
        FailureReason:
          type: string
          description: >-
            Why the run ended the way it did, for example `PIPELINE_INVALID`, `IMAGE_PIN_FAILED`, `CHECKOUT_UNAVAILABLE`,
            `JOBS_FAILED`, `CANCELED`, `REPOSITORY_UNLINKED` (the repository was unlinked while the run was open),
            `DEFINITION_NOT_FOUND`, `TRIGGER_NOT_ENABLED`, `RUN_EXPANSION_FAILED` (the server
            could not make the run's jobs), `RUN_STATE_INVALID` (a stored value of the run could not be read),
            `SHA_NOT_ON_REF` (the commit is not in the history of its ref), `DISCOVERY_FAILED` (the job that reads the file
            of a generic repository failed), `DEFINITION_UNVERIFIED` (the git objects that job handed over do not prove the
            file is in the run's commit) or `REPOSITORY_UNAVAILABLE`.
        DefinitionPath:
          type: string
        DefinitionSha:
          type: string
          description: The commit the pipeline file was read from. For a fork's pull request it is the base.
        DefinitionDigest:
          type: string
          description: Hex SHA-256 of the pipeline file the run uses.
        ConcurrencyGroup:
          type: string
        TriggeredByUserId:
          type: string
          format: uuid
        ApprovedByUserId:
          type: string
          format: uuid
        ApprovedAt:
          type: string
          format: date-time
        CancelRequestedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
    RunJob:
      type: object
      additionalProperties: false
      required: [Id, Key, Kind, JobId, Name, Matrix, Needs, State, Attempts]
      properties:
        Id:
          type: string
          format: uuid
        Key:
          type: string
          description: The job's id, with its matrix values for a matrix job, such as `build (node=20, os=debian)`.
        Kind:
          $ref: "#/components/schemas/RunJobKind"
        JobId:
          type: string
          description: The id of the job in the pipeline file.
        Name:
          type: string
        Matrix:
          type: object
          additionalProperties:
            type: string
        Needs:
          type: array
          items:
            type: string
        State:
          $ref: "#/components/schemas/RunJobState"
        FailureReason:
          type: string
          description: >-
            For example `NEEDS_FAILED`, `CONDITION_FALSE`, `FORK_PR_NO_ENVIRONMENT`, `ENVIRONMENT_NOT_FOUND`,
            `DEPLOYMENT_REJECTED`, `APPROVAL_EXPIRED`, `SUPERSEDED`,
            `ENVIRONMENT_REF_NOT_ALLOWED`, `ENVIRONMENT_REQUIRES_PINNED_IMAGES`, `ENVIRONMENT_PLUGIN_NOT_ALLOWED`,
            `ENVIRONMENT_RULE_CHANGED`, `SECRETS_UNAVAILABLE`, `JOB_SPEC_INVALID`, a deploy target refusal such as
            `TARGET_NOT_FOUND`, `TARGET_NOT_LITERAL`, `TARGET_REQUIRES_ENVIRONMENT`, `TARGET_HOST_KEY_UNCONFIRMED`,
            `TARGET_KEY_NOT_FOUND`, `TARGET_PLUGIN_NOT_ALLOWED`, `TARGET_ARTIFACT_REQUIRED`, `TARGET_JOB_EGRESS_NOT_ALLOWED`,
            `TARGET_CHANGED`, `TARGET_PLUGIN_NOT_PINNED`, `TARGET_KEY_NOT_REFERENCEABLE`, `HEALTH_URL_INVALID`, `HEALTH_URL_NOT_ALLOWED`, `HEALTH_BUDGET_EXCEEDED` or `ROLLING_BUDGET_EXCEEDED`, or the failure of
            the job itself such as `STEP_FAILED` or `CHECKOUT_REF_MOVED`. A job that succeeded with outputs too large to keep has
            `OUTPUTS_TRUNCATED`.
        FailureNames:
          type: array
          description: >-
            With `SECRET_NOT_FOUND` or `SECRET_NOT_AVAILABLE_TO_PULL_REQUESTS`, the names of the secrets. With `TARGET_NOT_FOUND`,
            `TARGET_PLUGIN_NOT_ALLOWED`, `TARGET_KEY_NOT_FOUND` or `TARGET_KEY_NOT_REFERENCEABLE`, the name of the target or of its key secret, and with
            `TARGET_HOST_KEY_UNCONFIRMED` the addresses of the hosts without a pinned key. Never a value.
          items:
            type: string
        Environment:
          type: string
          description: The environment the job names in `environment:`, if any.
        EnvironmentId:
          type: string
          format: uuid
          description: The environment the job waits on or deployed to, once it reached the gate.
        Gate:
          $ref: "#/components/schemas/RunJobGate"
        GateOpensAt:
          type: string
          format: date-time
          description: With the `timer` gate, or after it, when the wait timer of the environment ends.
        CurrentJobId:
          type: string
          format: uuid
          description: The job that runs this entry now, or ran it last. Its logs are under `/jobs/{jobId}`.
        Attempts:
          type: integer
          minimum: 0
          description: How many jobs this entry has had, reruns included.
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
    RunDetail:
      type: object
      additionalProperties: false
      required: [Run, Jobs, Issues, ImagePins]
      properties:
        Run:
          $ref: "#/components/schemas/Run"
        Jobs:
          type: array
          description: In the order of the pipeline, every job after the jobs it needs.
          items:
            $ref: "#/components/schemas/RunJob"
        Issues:
          type: array
          items:
            $ref: "#/components/schemas/RunIssue"
        ImagePins:
          type: array
          items:
            $ref: "#/components/schemas/RunImagePin"
    RunResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Run"
    ManualInputType:
      type: string
      enum: [string, boolean, choice]
    ManualInput:
      type: object
      additionalProperties: false
      required: [Name, Type, Required, Options]
      properties:
        Name:
          type: string
        Type:
          $ref: "#/components/schemas/ManualInputType"
        Description:
          type: string
        Required:
          type: boolean
        Default:
          type: string
          description: The default as text. For a boolean it is `true` or `false`.
        Options:
          type: array
          description: The allowed values of a `choice`. Empty for the other types.
          items:
            type: string
    ManualInputs:
      type: object
      additionalProperties: false
      required: [Known, Enabled, Ref, Inputs]
      properties:
        Known:
          type: boolean
          description: False while no run of the default branch has read the pipeline file.
        Enabled:
          type: boolean
          description: The pipeline file has `on.manual`.
        Ref:
          type: string
          description: The default branch, as `refs/heads/<name>`.
        Sha:
          type: string
          description: The commit the inputs were read from.
        Inputs:
          type: array
          items:
            $ref: "#/components/schemas/ManualInput"
    ManualInputsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/ManualInputs"
    Artifact:
      type: object
      additionalProperties: false
      required: [Id, RunId, Name, RunJobKey, SizeBytes, Digest, Untrusted, CreatedAt, ExpiresAt]
      properties:
        Id:
          type: string
          format: uuid
        RunId:
          type: string
          format: uuid
        Name:
          type: string
        RunJobKey:
          type: string
          description: The job of the run that uploaded it, with its matrix values.
        SizeBytes:
          type: integer
          format: int64
          minimum: 0
        Digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The SHA-256 of the archive, in hex.
        Untrusted:
          type: boolean
          description: The run came from a fork's pull request, so the artifact can never feed a deploy.
        CreatedAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
    ArtifactListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Artifact"
    RunDetailResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/RunDetail"
    RunListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Run"
    TriggerRunRequest:
      type: object
      additionalProperties: false
      required: [Ref]
      properties:
        Ref:
          type: string
          minLength: 1
          maxLength: 255
        Sha:
          type: string
          minLength: 40
          maxLength: 64
          description: The full commit hash. Optional.
        Inputs:
          type: object
          maxProperties: 20
          description: Values for `on.manual.inputs`, each a string or a boolean.
          additionalProperties: true
    GitProvider:
      type: string
      enum: [github, gitlab, generic]
    GitTransport:
      type: string
      enum: [https, ssh]
    RepositoryState:
      type: string
      enum: [ready, host_key_unconfirmed]
      description: >-
        `host_key_unconfirmed`: an SSH repository whose host key nobody has confirmed yet. Webhooks for it are recorded
        and ignored until someone confirms the fingerprint.
    Repository:
      type: object
      additionalProperties: false
      required: [Id, ProjectId, Provider, CloneUrl, Transport, FullName, DefaultBranch, WebhookUrl, State, CreatedAt, UpdatedAt]
      properties:
        Id:
          type: string
          format: uuid
        ProjectId:
          type: string
          format: uuid
        Provider:
          $ref: "#/components/schemas/GitProvider"
        CloneUrl:
          type: string
          description: The clone address in its canonical form, such as `ssh://git@git.example.com/team/app.git`.
        Transport:
          $ref: "#/components/schemas/GitTransport"
        FullName:
          type: string
        DefaultBranch:
          type: string
        WebhookUrl:
          type: string
          description: Where the Git server sends push webhooks. Its last part is random, not the repository id.
        DeployKeyPublic:
          type: string
          description: The public half of the deploy key, to add to the Git server as a read-only key. SSH only.
        PreviousDeployKeyPublic:
          type: string
          description: The previous public key, while it still works after a rotation.
        PreviousDeployKeyExpiresAt:
          type: string
          format: date-time
        HostKeyFingerprint:
          type: string
          description: The `SHA256:` fingerprint of the pinned host key.
        PendingHostKeyFingerprint:
          type: string
          description: The `SHA256:` fingerprint of a fetched host key that waits for confirmation.
        State:
          $ref: "#/components/schemas/RepositoryState"
        LastDeliveryAt:
          type: string
          format: date-time
          description: When a correctly signed webhook last arrived.
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
    RepositoryResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Repository"
    LinkRepositoryRequest:
      type: object
      additionalProperties: false
      required: [CloneUrl]
      properties:
        CloneUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            `ssh://user@host[:port]/path`, `user@host:path` or `https://host[:port]/path`. A DNS name, never an IP
            address, and no password, query, `..` or leading dash.
        DefaultBranch:
          type: string
          minLength: 1
          maxLength: 244
          description: Defaults to `main`. A branch name by the rules of `git check-ref-format`.
    RepositoryWithSecret:
      type: object
      additionalProperties: false
      required: [Repository]
      properties:
        Repository:
          $ref: "#/components/schemas/Repository"
        WebhookSecret:
          type: string
          description: The webhook secret. Shown only in the answer that made it.
    LinkRepositoryResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/RepositoryWithSecret"
    WebhookSecretResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/RepositoryWithSecret"
    ConfirmHostKeyRequest:
      type: object
      additionalProperties: false
      required: [Fingerprint]
      properties:
        Fingerprint:
          type: string
          minLength: 50
          maxLength: 50
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    OverviewJobs:
      type: object
      nullable: true
      additionalProperties: false
      required: [Running, Queued, QueuedNoRunner, FailedLast24h]
      properties:
        Running:
          type: integer
          minimum: 0
          description: Jobs in the `leased` or `running` state.
        Queued:
          type: integer
          minimum: 0
          description: Jobs in the `queued` state.
        QueuedNoRunner:
          type: integer
          minimum: 0
          description: Queued jobs with `QueuedReason` `NO_MATCHING_RUNNER`. Part of `Queued`.
        FailedLast24h:
          type: integer
          minimum: 0
          description: Jobs that finished `failed` or `timed_out` in the last 24 hours.
    OverviewRunners:
      type: object
      nullable: true
      additionalProperties: false
      required: [Online, Offline, Paused]
      properties:
        Online:
          type: integer
          minimum: 0
          description: Active runners seen in the last two minutes.
        Offline:
          type: integer
          minimum: 0
          description: Active runners not seen in the last two minutes.
        Paused:
          type: integer
          minimum: 0
          description: Disabled runners, by an admin or because a clone was suspected.
    OverviewInvitations:
      type: object
      nullable: true
      additionalProperties: false
      required: [Pending]
      properties:
        Pending:
          type: integer
          minimum: 0
          description: Invitations that are not accepted, revoked or expired.
    OverviewApprovals:
      type: object
      nullable: true
      additionalProperties: false
      required: [Pending]
      properties:
        Pending:
          type: integer
          minimum: 0
          description: >-
            Deploy approval requests waiting on an environment where you are a reviewer, directly or through a team. The
            exact list of the ones you may decide is `GET /organizations/{id}/deployment-approvals?Mine=true`.
    OrganizationOverview:
      type: object
      additionalProperties: false
      required: [Jobs, Runners, Invitations, Approvals]
      properties:
        Jobs:
          $ref: "#/components/schemas/OverviewJobs"
        Runners:
          $ref: "#/components/schemas/OverviewRunners"
        Invitations:
          $ref: "#/components/schemas/OverviewInvitations"
        Approvals:
          $ref: "#/components/schemas/OverviewApprovals"
    OrganizationOverviewResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/OrganizationOverview"
    SecretScope:
      type: string
      enum: [organization, project, environment]
    SecretVisibility:
      type: string
      enum: [all_projects, selected_projects]
      description: Organization secrets only. `selected_projects` limits it to `ProjectIds`.
    Secret:
      type: object
      additionalProperties: false
      description: A secret without its value. No response carries a value, a hash or a fingerprint.
      required: [Name, Scope, Description, Version, SizeBytes, AvailableToPullRequests, Visibility, ProjectIds, Overrides, CreatedAt, UpdatedAt, UpdatedByUserId]
      properties:
        Name:
          type: string
        Scope:
          $ref: "#/components/schemas/SecretScope"
        Description:
          type: string
        Version:
          type: integer
        SizeBytes:
          type: integer
        AvailableToPullRequests:
          type: boolean
        Visibility:
          $ref: "#/components/schemas/SecretVisibility"
        ProjectIds:
          type: array
          items:
            type: string
            format: uuid
        Overrides:
          type: array
          description: The wider scopes whose secret of the same name this one covers.
          items:
            $ref: "#/components/schemas/SecretScope"
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        UpdatedByUserId:
          type: string
          format: uuid
        LastUsedAt:
          type: string
          format: date-time
    SecretResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Secret"
    SecretListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Secret"
    PutSecretRequest:
      type: object
      additionalProperties: false
      required: [Value]
      properties:
        Value:
          type: string
          writeOnly: true
          description: UTF-8 without NUL, 8 bytes to 32 KiB. Never returned.
        Description:
          type: string
          maxLength: 256
        AvailableToPullRequests:
          type: boolean
          description: Organization and project secrets. Environments decide this in their rules.
        Visibility:
          $ref: "#/components/schemas/SecretVisibility"
        ProjectIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    RestoreSecretVersionRequest:
      type: object
      additionalProperties: false
      required: [Version]
      properties:
        Version:
          type: integer
          minimum: 1
    Variable:
      type: object
      additionalProperties: false
      required: [Name, Scope, Value, Overrides, CreatedAt, UpdatedAt, UpdatedByUserId]
      properties:
        Name:
          type: string
        Scope:
          $ref: "#/components/schemas/SecretScope"
        Value:
          type: string
        Overrides:
          type: array
          items:
            $ref: "#/components/schemas/SecretScope"
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        UpdatedByUserId:
          type: string
          format: uuid
    VariableResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Variable"
    VariableListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Variable"
    PutVariableRequest:
      type: object
      additionalProperties: false
      required: [Value]
      properties:
        Value:
          type: string
          description: UTF-8 text up to 4 KiB.
    RegistryCredential:
      type: object
      additionalProperties: false
      description: A registry credential without its password.
      required: [Id, Scope, Host, Username, CreatedAt, UpdatedAt, UpdatedByUserId]
      properties:
        Id:
          type: string
          format: uuid
        Scope:
          $ref: "#/components/schemas/SecretScope"
        Host:
          type: string
        Username:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        UpdatedByUserId:
          type: string
          format: uuid
    RegistryCredentialResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/RegistryCredential"
    RegistryCredentialListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/RegistryCredential"
    CreateRegistryCredentialRequest:
      type: object
      additionalProperties: false
      required: [Host, Username, Password]
      properties:
        Host:
          type: string
          maxLength: 259
        Username:
          type: string
          minLength: 1
          maxLength: 256
        Password:
          type: string
          writeOnly: true
    UpdateRegistryCredentialRequest:
      type: object
      additionalProperties: false
      required: [Username, Password]
      properties:
        Username:
          type: string
          minLength: 1
          maxLength: 256
        Password:
          type: string
          writeOnly: true
