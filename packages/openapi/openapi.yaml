    post:
      operationId: createEnvironment
      tags: [environments]
      summary: Create an environment
      description: >-
        Needs `environment.manage` on the project (Admin and Owner, or an Admin binding on this project) and a fresh
        `CurrentFactor`. A pipeline file never creates an environment: a job that names a missing one fails with `ENVIRONMENT_NOT_FOUND`. The name
        is unique among the project's environments (409 `ENVIRONMENT_EXISTS`) and never changes. Rules left out take
        their defaults, and `AllowedRefs` defaults to the default branch of the linked repository (`main` without one).
        A reviewer who is not a member, or whose role on the project is below Developer, or a team of another
        organization, answers 422 `REVIEWER_NOT_ELIGIBLE`. An archived project answers 409 `PROJECT_ARCHIVED`.
      security:
