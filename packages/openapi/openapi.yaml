        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentFactorRequest"
      responses:
        "200":
          description: The removed environment, as it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/pause:
    post:
      operationId: pauseEnvironment
      tags: [environments]
      summary: Stop new deploys to an environment
      description: >-
        Needs `environment.pause` on the project (Maintainer and above), without a second factor so it never waits
        during an incident. Jobs already running finish; new ones wait. Pausing a paused environment changes nothing.
        Raises `RuleVersion`. Only `environment.manage` resumes it.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
