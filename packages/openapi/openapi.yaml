        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RegistryCredentialId"
      responses:
        "200":
          description: The removed registry credential, as it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryCredentialResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/secrets:
    get:
      operationId: listEnvironmentSecrets
      tags: [secrets]
      summary: List the secrets of an environment
      description: >-
        Needs `secret.read`. Names and metadata only: no value, hash or fingerprint is ever returned. `Overrides` lists the
        wider scopes whose secret of the same name this one covers.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/secrets/{secretName}:
    put:
      operationId: putEnvironmentSecret
      tags: [secrets]
      summary: Create a secret of an environment, or write a new version
      description: >-
        Needs `environment.manage`. Creates the secret or a new version of it. The value is UTF-8 without NUL, 8 bytes
        (`SECRET_TOO_SHORT`) to 32 KiB (`SECRET_TOO_LARGE`), and is never returned. Names are unique in the
        scope whatever their case, and names that start with `DHOW_` answer `SECRET_NAME_RESERVED`. The
        value of a version older than the last five, or replaced more than 30 days ago, is erased.
        Only jobs that name this environment receive it, once the environment lets them deploy.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/SecretName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSecretRequest"
      responses:
        "200":
          description: The secret, without its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/secrets/{secretName}/remove:
    post:
      operationId: removeEnvironmentSecret
      tags: [secrets]
      summary: Remove a secret of an environment
      description: >-
        Needs `environment.manage`. Marks the secret deleted and erases the values of all its versions in the same
        transaction. The name can be used again.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/SecretName"
      responses:
        "200":
          description: The removed secret, as it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/secrets/{secretName}/restore-version:
    post:
      operationId: restoreEnvironmentSecretVersion
      tags: [secrets]
      summary: Restore an earlier version of a secret of an environment
      description: >-
        Needs `environment.manage`. Writes the value of an earlier version as a new version. A version whose value
        was erased answers 409 `SECRET_VERSION_ERASED`.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/SecretName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreSecretVersionRequest"
      responses:
        "200":
          description: The secret with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/variables:
    get:
      operationId: listEnvironmentVariables
      tags: [secrets]
      summary: List the variables of an environment
      description: >-
        Needs `project.read`. Variables are not secret: anyone who can read the project reads their values.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of variables.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/variables/{variableName}:
    put:
      operationId: putEnvironmentVariable
      tags: [secrets]
      summary: Create or change a variable of an environment
      description: >-
        Needs `environment.manage`. The value is UTF-8 text up to 4 KiB. Same name rules as secrets.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/VariableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutVariableRequest"
      responses:
        "200":
          description: The variable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/variables/{variableName}/remove:
    post:
      operationId: removeEnvironmentVariable
      tags: [secrets]
      summary: Remove a variable of an environment
      description: >-
        Needs `environment.manage`. The name can be used again.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/VariableName"
      responses:
        "200":
          description: The removed variable, as it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/repository:
    get:
      operationId: getRepository
      tags: [sources]
      summary: Read the repository linked to a project
      description: >-
        Needs `project.read` on the project. Shows the clone address, the webhook address, the public half of the deploy
        key and the fingerprints of the pinned and the pending host keys. Never shows a private key or a webhook secret.
        A project without a repository answers 404 `REPOSITORY_NOT_LINKED`.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: linkRepository
      tags: [sources]
      summary: Link a Git repository to a project, or change its address
      description: >-
        Needs `project.manage` on the project. Generic Git only in this version: an `ssh://` or `user@host:path` address
        with a deploy key that Dhow makes, or an `https://` address of a public repository. For SSH, Dhow fetches the
        host key over the network (private addresses are refused unless `DHOW_GIT_ALLOW_PRIVATE_CIDRS` allows them) and
        keeps it pending until someone confirms its fingerprint. The first link answers 201 with the webhook secret, the
        only time it is shown; a later call answers 200 without it, keeps the deploy key and the webhook, and fetches
        the host key again. An archived project answers 409 `PROJECT_ARCHIVED`.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRepositoryRequest"
      responses:
        "200":
          description: The repository after a change of address. No webhook secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRepositoryResponse"
        "201":
          description: The new link, with the webhook secret shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRepositoryResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlinkRepository
      tags: [sources]
      summary: Unlink the repository from a project
      description: >-
        Needs `project.manage` on the project. The deploy key and the webhook stop working at once: a webhook to the old
        address answers 401, and no new run starts until a repository is linked again, with a new deploy key, host key
        and webhook secret. The project's open runs (waiting for approval, pending, queued or running) are canceled with
        `REPOSITORY_UNLINKED`, its unsent commit statuses are abandoned, and the stored deploy keys and webhook secret
        are erased. A project without a repository answers 404
        `REPOSITORY_NOT_LINKED`, and an archived project 409 `PROJECT_ARCHIVED`.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The repository as it was before the unlink.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/repository/confirm-host-key:
    post:
      operationId: confirmHostKey
      tags: [sources]
      summary: Pin the pending host key
      description: >-
        Needs `project.manage` on the project. The fingerprint must be the one of the pending host key, as
        `GetRepository` showed it (`SHA256:...`), or the answer is 409 `HOST_KEY_FINGERPRINT_MISMATCH`. Without a
        pending key the answer is 409 `HOST_KEY_NOT_PENDING`. Dhow never pins a host key by itself, also not when it
        changes.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmHostKeyRequest"
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/repository/rotate-deploy-key:
    post:
      operationId: rotateDeployKey
      tags: [sources]
      summary: Make a new deploy key
      description: >-
        Needs `project.manage` on the project. Only for SSH. The answer shows the public half of the new key. The
        previous key keeps working for 24 hours, or until `confirm-deploy-key`, so you can add the new key to the Git
        server first.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/repository/confirm-deploy-key:
    post:
      operationId: confirmDeployKey
      tags: [sources]
      summary: Stop using the previous deploy key
      description: >-
        Needs `project.manage` on the project. Call it after adding the new public key to the Git server. Idempotent.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/repository/rotate-webhook-secret:
    post:
      operationId: rotateWebhookSecret
      tags: [sources]
      summary: Make a new webhook secret
      description: >-
        Needs `project.manage` on the project. The answer shows the new secret once. The previous secret stops working
        at once.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The repository and its new webhook secret, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs:
    get:
      operationId: listRuns
      tags: [pipelines]
      summary: List the runs of a project
      description: >-
        Needs `run.read` on the project, after its role bindings. Newest first, optionally filtered by one or more states
        and by ref. A project of another organization is 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: State
          in: query
          required: false
          description: One or more run states, repeated or comma-separated.
          schema:
            type: array
            maxItems: 8
            items:
              type: string
        - name: Ref
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: A page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: triggerRun
      tags: [pipelines]
      summary: Start a run by hand or from an API token
      description: >-
        Needs `run.trigger` on the project. A session starts a `manual` run and an API token starts an `api` run, and the
        pipeline must allow that trigger in `on:`. `Ref` is a branch (`main` or `refs/heads/main`) or a tag
        (`refs/tags/v1`). The commit must be one a webhook already brought for that ref from the repository itself (not
        from a fork): a `Sha` that did not answers 422 `SHA_NOT_ON_REF`, and without `Sha` the run takes the latest such
        commit, or answers 422 `REF_HEAD_UNKNOWN` when no webhook brought one yet. `Inputs` are checked against
        `on.manual.inputs` when the run starts, and a wrong input fails the run with `INPUTS_INVALID`. A project without a
        repository answers 404 `REPOSITORY_NOT_LINKED`, and an archived project 409 `PROJECT_ARCHIVED`. One user starts
        at most 60 runs and one project 240 runs in ten minutes (429 `RATE_LIMITED`).
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunRequest"
      responses:
        "201":
          description: The new run, still pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs/{runId}:
    get:
      operationId: getRun
      tags: [pipelines]
      summary: Read a run with its jobs and the problems found in its pipeline file
      description: >-
        Needs `run.read` on the project. A run whose pipeline file is wrong has `FailureReason` `PIPELINE_INVALID` and
        lists every problem in `Issues`, with its line and column. A run of another project is 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      tags: [pipelines]
      summary: Cancel a run
      description: >-
        Needs `run.cancel` on the project. Idempotent. Jobs that have not started are canceled at once, and a running
        job sees the request on its runner's next heartbeat. A run that already finished is returned as it is.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs/{runId}/rerun-failed:
    post:
      operationId: rerunFailedRun
      tags: [pipelines]
      summary: Run the failed and canceled jobs of a finished run again
      description: >-
        Needs `run.trigger` on the project. Only a run that ended `failed` or `canceled` can be run again (409
        `RUN_NOT_RERUNNABLE` otherwise), and only while a repository is linked (404 `REPOSITORY_NOT_LINKED`). Every job that failed, was canceled or was skipped because of them waits again
        and gets a new job; the jobs that succeeded keep their result. The run uses the same pipeline file and the
        same image digests as before.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run, running again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs/{runId}/approve:
    post:
      operationId: approveRun
      tags: [pipelines]
      summary: Approve a run from a fork's pull request
      description: >-
        Needs `run.approve` on the project (Maintainer and above). Only a run that waits for approval can be approved
        (409 `RUN_NOT_AWAITING_APPROVAL` otherwise), and only while a repository is linked (404 `REPOSITORY_NOT_LINKED`). The run still has no secrets and no environments, and reads its
        pipeline file from the base branch.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The approved run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs/{runId}/artifacts:
    get:
      operationId: listRunArtifacts
      tags: [artifacts]
      summary: List the artifacts of a run
      description: >-
        Needs `artifact.read` on the project (Developer and above). Expired artifacts are not listed. A run of another
        project or organization is 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The artifacts of the run, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/artifacts/{artifactId}/download:
    get:
      operationId: downloadArtifact
      tags: [artifacts]
      summary: Download an artifact
      description: >-
        Needs `artifact.read` on the project. Streams the tar.gz archive as an attachment named after the artifact
        (`<name>.tar.gz`, with every character outside letters, digits, `.`, `_` and `-` replaced). An expired artifact
        is 404 `ARTIFACT_NOT_FOUND`, and a stored file that is missing or does not match its SHA-256 is 410
        `ARTIFACT_GONE`.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: The archive.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/manual-inputs:
    get:
      operationId: getManualInputs
      tags: [pipelines]
      summary: Read the inputs a manual run asks for
      description: >-
        Needs `run.trigger` on the project. Dhow reads the pipeline file only for a run, so the answer comes from the
        file of the latest run on the default branch that was not from a fork. `Known` is false when no such run read a
        file yet. `Enabled` says whether that file allows manual runs (`on.manual`), and `Inputs` lists what
        `on.manual.inputs` declares, by name. A project without a repository answers 404 `REPOSITORY_NOT_LINKED`.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The manual inputs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualInputsResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/overview:
    get:
      operationId: getOrganizationOverview
      tags: [overview]
      summary: Counts of what needs attention in an organization
      description: >-
        Needs `org.read`. One request for the home page and the sidebar counters, so the client does not page through
        every list to count. Each block needs the same permission as its list: `Jobs` needs `job.read`, `Runners`
        needs `runner.read` and `Invitations` needs `member.manage`. A block the caller may not read is `null`, never
        zero, so the client can tell "none" from "not yours to see". `Jobs.Running` counts the `leased` and `running`
        states. `Jobs.QueuedNoRunner` counts queued jobs whose `QueuedReason` is `NO_MATCHING_RUNNER`.
        `Jobs.FailedLast24h` counts the `failed` and `timed_out` states that finished in the last 24 hours.
        `Runners.Online` and `Runners.Offline` follow the `Status` rule of the runners list (seen in the last two
        minutes) for active runners, and `Runners.Paused` counts disabled runners. Revoked runners are not counted.
        `Invitations.Pending` counts invitations that are not accepted, revoked or expired. A caller who is not a
        member gets 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The counts the caller may read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationOverviewResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings:
    get:
      operationId: getInstanceSettings
      tags: [settings]
      summary: Every dashboard setting, with where each value comes from
      description: >-
        Needs `instance.settings.manage` (the instance owner only, never an API token). Each setting carries its
        effective `Value`, its `Source` (`env`, `database` or `default`), `Locked` (true when an environment variable
        sets it) and `Env`, the name of that variable. A secret never comes back: it is `{Set, Locked, Env}` only.
        Each group carries the `Version` to send back when you change it.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The settings of every group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/mail:
    put:
      operationId: updateMailSettings
      tags: [settings]
      summary: Change the mail settings
      description: >-
        Needs `instance.settings.manage`, a second factor on the caller's account (`SECOND_FACTOR_REQUIRED`
        otherwise) and a fresh `CurrentFactor`. Send only the fields you change. A field you leave out keeps its value.
        An empty string removes a field from the database, so it goes back to its default. For `Password`, leave it
        out to keep the saved password, send a new value to replace it, or send an empty string to clear it. A field
        set by an environment variable answers `409 SETTING_LOCKED_BY_ENV`, a stale `Version` answers
        `409 SETTING_CHANGED`, and a bad value answers `400 SETTING_INVALID` with the field and the reason.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMailSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/mail/test:
    post:
      operationId: sendTestMail
      tags: [settings]
      summary: Send a test email to the caller
      description: >-
        Needs `instance.settings.manage`. Sends one short message to the caller's own address with the mail settings
        in effect now. Five tests per user in ten minutes (`429 RATE_LIMITED` after that). Mail that is off answers
        `409 MAIL_NOT_CONFIGURED`, and a mail server that refuses answers `502 MAIL_TEST_FAILED`; the reason is in
        the server log, never in the response.
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The address the message went to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailTestResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/organizations:
    put:
      operationId: updateOrganizationSettings
      tags: [settings]
      summary: Choose who may create organizations
      description: Same rules as `PUT /instance/settings/mail`.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/passwords:
    put:
      operationId: updatePasswordSettings
      tags: [settings]
      summary: Turn the breached-password check on or off
      description: Same rules as `PUT /instance/settings/mail`.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/rate-limits:
    put:
      operationId: updateRateLimitSettings
      tags: [settings]
      summary: Change the rate limits
      description: Same rules as `PUT /instance/settings/mail`.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRateLimitSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/logs:
    put:
      operationId: updateLogSettings
      tags: [settings]
      summary: Change how long job logs are kept and how large one attempt's log may grow
      description: >-
        Same rules as `PUT /instance/settings/mail`. A new `JobLogMaxBytes` applies to attempts that start after the
        change; a running attempt keeps the limit it started with.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLogSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/oidc:
    get:
      operationId: getOidcSettings
      tags: [settings]
      summary: The sign-in providers, where they come from and how many accounts use each
      description: >-
        Needs `instance.settings.manage`. When `DHOW_OIDC_PROVIDERS` is set in the environment, every provider comes
        from the environment (`Source: env`, `Locked: true`) and the dashboard cannot change them; providers saved in
        the database are then unused and only counted in `IgnoredStored`. Otherwise the providers come from the
        database. A client secret never comes back: it is `{Set, Saved, Locked, Env}` only. `LinkedIdentities` counts
        the accounts linked to the provider, and `OnlySignInUsers` counts the accounts that can sign in with nothing
        else, so removing or disabling the provider would lock them out.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The sign-in providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createOidcProvider
      tags: [settings]
      summary: Add a sign-in provider
      description: >-
        Needs `instance.settings.manage`, a second factor on the caller's account and a fresh `CurrentFactor`. The `Id`
        is part of the callback URL and of linked accounts, so it never changes later. Providers from the environment
        answer `409 SETTING_LOCKED_BY_ENV`, an `Id` in use answers `409 OIDC_PROVIDER_EXISTS`, an eleventh provider
        answers `409 OIDC_PROVIDER_LIMIT`, an `Id` whose old linked accounts use another issuer answers
        `409 OIDC_PROVIDER_LINKED`, and a bad value answers `400 SETTING_INVALID` with the field and the reason.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOidcProviderRequest"
      responses:
        "200":
          description: Every provider, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/oidc/test:
    post:
      operationId: testOidcProvider
      tags: [settings]
      summary: Check that the server can reach an identity provider
      description: >-
        Needs `instance.settings.manage`. For `oidc`, fetches the discovery document of `Issuer`, checks that its
        endpoints use https, and fetches the signing keys. For `github`, calls the API of `Issuer`. The client secret is
        never sent anywhere. Five tests per user in ten minutes (`429 RATE_LIMITED` after that). An issuer that is not
        valid, or that points at a link-local or cloud metadata address, answers `400 SETTING_INVALID`. The reason for a
        failed check is in the server log, never in the response.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestOidcProviderRequest"
      responses:
        "200":
          description: Which checks passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcTestResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/oidc/{providerId}:
    put:
      operationId: updateOidcProvider
      tags: [settings]
      summary: Change a sign-in provider
      description: >-
        Same rules as `POST /instance/settings/oidc`, with the provider's `Version` (`409 SETTING_CHANGED` when stale).
        Send only the fields you change. `Type` and `Issuer` cannot change once accounts are linked to the provider
        (`409 OIDC_PROVIDER_LINKED`): add a new provider instead. For `ClientSecret`, leave it out to keep it, send a
        value to replace it, or send "" to clear it, which turns the provider off. Turning off a provider that some
        accounts need to sign in answers `409 OIDC_PROVIDER_ONLY_SIGN_IN` with the number of accounts in `Details`.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOidcProviderRequest"
      responses:
        "200":
          description: Every provider, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/oidc/{providerId}/remove:
    post:
      operationId: removeOidcProvider
      tags: [settings]
      summary: Remove a sign-in provider
      description: >-
        Needs `instance.settings.manage` and a fresh `CurrentFactor`, with the provider's `Version`. The provider is
        soft deleted: accounts linked to it keep the link, see it on their account page and can unlink it. When some
        accounts can sign in with nothing else, the server refuses with `409 OIDC_PROVIDER_ONLY_SIGN_IN` and the number
        of accounts in `Details`. Sessions that are already open stay open.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveOidcProviderRequest"
      responses:
        "200":
          description: Every provider, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-dhow_session
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    ApiToken:
      type: http
      scheme: bearer
      description: >-
        A personal API token. Accepted only on the routes that list it, never together with a session cookie, and
        without the CSRF token or the Origin check because a browser never sends it on its own.
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9]{0,31}$"
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditCategory:
      name: Category
      in: query
      required: false
      description: Only events whose action starts with this category, such as `auth` for `auth.login`.
      schema:
        $ref: "#/components/schemas/AuditCategory"
    AuditAction:
      name: Action
      in: query
      required: false
      description: Only events with exactly this action.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuditActor:
      name: ActorUserId
      in: query
      required: false
      description: Only events done by this user.
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: From
      in: query
      required: false
      description: Only events at or after this time.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: To
      in: query
      required: false
      description: Only events before this time.
      schema:
        type: string
        format: date-time
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LogAttempt:
      name: Attempt
      in: query
      required: false
      description: The attempt number. Without it, the latest attempt.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    LogFromSeq:
      name: FromSeq
      in: query
      required: false
      description: The first chunk to return.
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
    LogLimit:
      name: Limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        The `id` of the last chunk event the client received, `<attempt>:<seq>`. When it names the attempt the stream
        follows, the stream resumes after that seq and ignores `FromSeq`. An id of another attempt (the job was retried
        while the client was away) is ignored, so the new attempt starts from `FromSeq` or the beginning.
      schema:
        type: string
        maxLength: 32
        pattern: "^[0-9]{1,10}:[0-9]{1,19}$"
    JobStateFilter:
      name: State
      in: query
      required: false
      description: >-
        Keep only jobs in these states. Repeat the parameter (`State=failed&State=timed_out`) or separate the states
        with commas (`State=failed,timed_out`). An unknown state is refused with 422 `VALIDATION_FAILED`.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 8
        items:
          type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SecretName:
      name: secretName
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$"
    VariableName:
      name: variableName
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$"
    RegistryCredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentName:
      name: environmentName
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
    TargetName:
      name: targetName
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
    TargetHostId:
      name: hostId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: Page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: Limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Error:
      description: An error. Never contains internal details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SettingSource:
      type: string
      enum: [env, database, default]
      description: Where the value in effect comes from. An environment variable wins over the database.
    StringSetting:
      type: object
      additionalProperties: false
      required: [Value, Source, Locked, Env]
      properties:
        Value:
          type: string
        Source:
          $ref: "#/components/schemas/SettingSource"
        Locked:
          type: boolean
          description: True when the environment variable `Env` sets it. The dashboard cannot change it then.
        LockedBy:
          type: string
          description: >-
            The environment variable that locks this setting: `Env` itself, or `DHOW_SMTP_PASSWORD` for the mail
            server, port and encryption when the SMTP password comes from the environment. Absent when not locked.
        Env:
          type: string
          example: DHOW_SMTP_HOST
    IntegerSetting:
      type: object
      additionalProperties: false
      required: [Value, Source, Locked, Env]
      properties:
        Value:
          type: integer
          format: int64
        Source:
          $ref: "#/components/schemas/SettingSource"
        Locked:
          type: boolean
        LockedBy:
          type: string
          description: >-
            The environment variable that locks this setting: `Env` itself, or `DHOW_SMTP_PASSWORD` for the mail
            server, port and encryption when the SMTP password comes from the environment. Absent when not locked.
        Env:
          type: string
    BooleanSetting:
      type: object
      additionalProperties: false
      required: [Value, Source, Locked, Env]
      properties:
        Value:
          type: boolean
        Source:
          $ref: "#/components/schemas/SettingSource"
        Locked:
          type: boolean
        LockedBy:
          type: string
          description: >-
            The environment variable that locks this setting: `Env` itself, or `DHOW_SMTP_PASSWORD` for the mail
            server, port and encryption when the SMTP password comes from the environment. Absent when not locked.
        Env:
          type: string
    SecretSetting:
      type: object
      additionalProperties: false
      required: [Set, Locked, Env, Saved]
      description: A write-only secret. Its value never comes back, only whether one is set.
      properties:
        Set:
          type: boolean
          description: True when a value is in effect, from the environment or the database.
        Saved:
          type: boolean
          description: >-
            True when a copy is saved in the database. With `Locked`, that copy is unused, and sending "" removes it.
        Locked:
          type: boolean
        Env:
          type: string
    MailSettings:
      type: object
      additionalProperties: false
      required: [Version, Host, Port, Tls, Username, Password, From]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        Host:
          $ref: "#/components/schemas/StringSetting"
        Port:
          $ref: "#/components/schemas/IntegerSetting"
        Tls:
          $ref: "#/components/schemas/StringSetting"
        Username:
          $ref: "#/components/schemas/StringSetting"
        Password:
          $ref: "#/components/schemas/SecretSetting"
        From:
          $ref: "#/components/schemas/StringSetting"
    OrganizationSettings:
      type: object
      additionalProperties: false
      required: [Version, Creation]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        Creation:
          $ref: "#/components/schemas/StringSetting"
    PasswordSettings:
      type: object
      additionalProperties: false
      required: [Version, BreachedCheck]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        BreachedCheck:
          $ref: "#/components/schemas/BooleanSetting"
    RateLimitSettings:
      type: object
      additionalProperties: false
      required: [Version, Public, InvitesPerUser, InvitesPerOrganization]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        Public:
          $ref: "#/components/schemas/IntegerSetting"
        InvitesPerUser:
          $ref: "#/components/schemas/IntegerSetting"
        InvitesPerOrganization:
          $ref: "#/components/schemas/IntegerSetting"
    LogSettings:
      type: object
      additionalProperties: false
      required: [Version, RetentionDays, JobLogMaxBytes]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        RetentionDays:
          $ref: "#/components/schemas/IntegerSetting"
        JobLogMaxBytes:
          $ref: "#/components/schemas/IntegerSetting"
    InstanceSettings:
      type: object
      additionalProperties: false
      required: [Mail, Organizations, Passwords, RateLimits, Logs]
      properties:
        Mail:
          $ref: "#/components/schemas/MailSettings"
        Organizations:
          $ref: "#/components/schemas/OrganizationSettings"
        Passwords:
          $ref: "#/components/schemas/PasswordSettings"
        RateLimits:
          $ref: "#/components/schemas/RateLimitSettings"
        Logs:
          $ref: "#/components/schemas/LogSettings"
    InstanceSettingsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/InstanceSettings"
    UpdateMailSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Host:
          type: string
          maxLength: 253
        Port:
          type: integer
          minimum: 1
          maximum: 65535
        Tls:
          type: string
          enum: [starttls, tls, none]
        Username:
          type: string
          maxLength: 320
        Password:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
          description: >-
            Leave out to keep the saved password, send a value to replace it, or send "" to clear it. When `Host`
            changes and a password is saved, send the password again (`400 SETTING_INVALID` otherwise), so a saved
            password never goes to a new server without the owner typing it. When `DHOW_SMTP_PASSWORD` is set in the
            environment, `Host`, `Port` and `Tls` are locked too (`409 SETTING_LOCKED_BY_ENV`), and "" only removes
            the unused database copy. From the dashboard, `Tls` may be `none` only for a loopback host.
        From:
          type: string
          maxLength: 320
    UpdateOrganizationSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Creation:
          type: string
          enum: [instance-owner, any-user]
    UpdatePasswordSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        BreachedCheck:
          type: boolean
    UpdateRateLimitSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Public:
          type: integer
          minimum: 1
          maximum: 100000
        InvitesPerUser:
          type: integer
          minimum: 1
          maximum: 100000
        InvitesPerOrganization:
          type: integer
          minimum: 1
          maximum: 100000
    UpdateLogSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        RetentionDays:
          type: integer
          minimum: 1
          maximum: 3650
        JobLogMaxBytes:
          type: integer
          format: int64
          minimum: 1048576
          maximum: 1073741824
    MailTest:
      type: object
      additionalProperties: false
      required: [SentTo]
      properties:
        SentTo:
          type: string
          format: email
    MailTestResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MailTest"
    OidcProviderType:
      type: string
      enum: [oidc, github]
      description: "`oidc` for any OpenID Connect provider, Google included; `github` for GitHub or GitHub Enterprise Server."
    OidcProviderSetting:
      type: object
      additionalProperties: false
      required: [Id, Type, Name, Issuer, ClientId, ClientSecret, AllowedDomains, Enabled, Version, LinkedIdentities, OnlySignInUsers, CallbackUrl]
      properties:
        Id:
          type: string
        Type:
          $ref: "#/components/schemas/OidcProviderType"
        Name:
          type: string
        Issuer:
          type: string
        ClientId:
          type: string
        ClientSecret:
          $ref: "#/components/schemas/SecretSetting"
        AllowedDomains:
          type: array
          items:
            type: string
        Enabled:
          type: boolean
          description: False when the client secret is cleared. The sign-in page shows enabled providers only.
        Version:
          type: integer
          format: int64
          minimum: 0
        LinkedIdentities:
          type: integer
          format: int64
          minimum: 0
        OnlySignInUsers:
          type: integer
          format: int64
          minimum: 0
          description: Accounts that can sign in only with this provider.
        CallbackUrl:
          type: string
          description: The redirect URL to register at the identity provider.
        UpdatedAt:
          type: string
          format: date-time
    OidcSettings:
      type: object
      additionalProperties: false
      required: [Source, Locked, Env, CallbackBase, MaxProviders, IgnoredStored, IgnoredLinkedIdentities, Providers]
      properties:
        Source:
          $ref: "#/components/schemas/SettingSource"
        Locked:
          type: boolean
          description: True when `DHOW_OIDC_PROVIDERS` is set. The whole list then comes from the environment.
        Env:
          type: string
          example: DHOW_OIDC_PROVIDERS
        CallbackBase:
          type: string
          description: The callback URL without the provider id, such as `https://dhow.example.com/oidc/callback/`.
        MaxProviders:
          type: integer
        IgnoredStored:
          type: integer
          format: int64
          minimum: 0
          description: Providers saved in the database that are unused because the environment sets the list.
        IgnoredLinkedIdentities:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Accounts linked to those unused providers, counting only providers whose id the environment list does not
            reuse. They cannot sign in with that provider while `DHOW_OIDC_PROVIDERS` is set. Zero when not locked.
        Providers:
          type: array
          items:
            $ref: "#/components/schemas/OidcProviderSetting"
    OidcSettingsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/OidcSettings"
    CreateOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [CurrentFactor, Id, Type, ClientId, ClientSecret]
      properties:
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Id:
          type: string
          pattern: "^[a-z][a-z0-9]{0,31}$"
        Type:
          $ref: "#/components/schemas/OidcProviderType"
        Name:
          type: string
          maxLength: 40
          description: The label on the sign-in button, at most 40 characters. Empty takes the id, or GitHub.
        Issuer:
          type: string
          maxLength: 2048
          description: Required for `oidc`. Empty for `github` means https://github.com.
        ClientId:
          type: string
          maxLength: 512
        ClientSecret:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
        AllowedDomains:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
    UpdateOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Type:
          $ref: "#/components/schemas/OidcProviderType"
        Name:
          type: string
          maxLength: 40
        Issuer:
          type: string
          maxLength: 2048
        ClientId:
          type: string
          maxLength: 512
        ClientSecret:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
          description: Leave out to keep the secret, send a value to replace it, or send "" to clear it and turn the provider off.
        AllowedDomains:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
    RemoveOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    TestOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [Type]
      properties:
        Type:
          $ref: "#/components/schemas/OidcProviderType"
        Issuer:
          type: string
          maxLength: 2048
    OidcTestCheck:
      type: object
      additionalProperties: false
      required: [Check, Passed]
      properties:
        Check:
          type: string
          enum: [discovery, endpoints, keys, api]
          description: >-
            `discovery`: the server reached the issuer and read its discovery document. `endpoints`: every endpoint in
            it uses https. `keys`: the signing keys were fetched. `api`: the GitHub API answered.
        Passed:
          type: boolean
    OidcTest:
      type: object
      additionalProperties: false
      required: [Passed, Checks]
      properties:
        Passed:
          type: boolean
        Checks:
          type: array
          items:
            $ref: "#/components/schemas/OidcTestCheck"
    OidcTestResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/OidcTest"
    Envelope:
      type: object
      required: [Success]
      properties:
        Success:
          type: boolean
        Message:
          type: string
          description: An i18n key such as `system.meta.loaded`. The client translates it.
          example: system.meta.loaded
        Meta:
          $ref: "#/components/schemas/PageMeta"
        Error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [Error]
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/HealthStatus"
    MetaResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Meta"
    PageMeta:
      type: object
      additionalProperties: false
      required: [Page, Limit, Total]
      properties:
        Page:
          type: integer
          minimum: 1
        Limit:
          type: integer
          minimum: 1
        Total:
          type: integer
          minimum: 0
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [Code, Message]
      properties:
        Code:
          type: string
          description: >-
            Stable machine-readable UPPER_SNAKE code: `INTERNAL`, `NOT_FOUND`, `METHOD_NOT_ALLOWED`,
            `BAD_REQUEST`, `VALIDATION_FAILED`, `PAYLOAD_TOO_LARGE`, `SERVICE_UNAVAILABLE`, `UNAUTHENTICATED`,
            `FORBIDDEN`, `CSRF_FAILED`, `INVALID_CREDENTIALS`, `INVALID_CURRENT_PASSWORD`, `PASSWORD_BREACHED`,
            `SETUP_COMPLETED`, `SETUP_TOKEN_INVALID`, `CONFLICT`, `MFA_CHALLENGE_EXPIRED`, `INVALID_MFA_CODE`,
            `INVALID_CURRENT_FACTOR`, `ENROLLMENT_EXPIRED`, `PASSKEY_REJECTED`, `LAST_OWNER`, `ROLE_NOT_ALLOWED`,
            `ALREADY_MEMBER`, `INVITATION_PENDING`, `INVITATION_INVALID`, `INVITATION_EMAIL_MISMATCH`,
            `INVITATION_ACCOUNT_EXISTS`, `SECOND_FACTOR_REQUIRED`, `SETTING_LOCKED_BY_ENV`, `SETTING_CHANGED`,
            `SETTING_INVALID`, `MAIL_NOT_CONFIGURED`, `MAIL_TEST_FAILED`, `OIDC_PROVIDER_EXISTS`, `OIDC_PROVIDER_LIMIT`,
            `OIDC_PROVIDER_LINKED`, `OIDC_PROVIDER_ONLY_SIGN_IN`, `PROJECT_ARCHIVED`, `FORK_POLICY_NOT_ALLOWED`,
            `ENVIRONMENT_EXISTS`, `ENVIRONMENT_VERSION_CONFLICT`, `REVIEWER_NOT_ELIGIBLE`, `TARGET_EXISTS`, `TARGET_DUPLICATE`,
            `TARGET_VERSION_CONFLICT`, `TARGET_HOST_BLOCKED`, `TARGET_HOST_UNREACHABLE`, `TARGET_KEY_NOT_FOUND`,
            `DEPLOY_PATH_INVALID`, `TARGET_KEY_NAME_TAKEN`, `HOST_KEY_NOT_PENDING` or `HOST_KEY_FINGERPRINT_MISMATCH`.
          example: INTERNAL
        Message:
          type: string
          description: Message translated by the server for the Accept-Language locale (Arabic by default).
          example: Something went wrong. Try again later.
        Details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFieldDetail"
    ErrorFieldDetail:
      type: object
      additionalProperties: false
      required: [Field, Message]
      properties:
        Field:
          type: string
        Message:
          type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required: [Status, Checks]
      properties:
        Status:
          type: string
          enum: [ok, unavailable]
        Checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      additionalProperties: false
      required: [Name, Ok]
      properties:
        Name:
          type: string
          enum: [database, migrations, log_partitions, settings, keyring]
        Ok:
          type: boolean
    KeyringStatusResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/KeyringStatus"
    KeyringStatus:
      type: object
      additionalProperties: false
      required: [Provider, ActiveVersion, Versions, ToRewrap, LoadedVersions]
      properties:
        Provider:
          type: string
          description: Where the KEKs of this server come from. `file` in Community.
          example: file
        ActiveVersion:
          type: integer
          format: int32
          description: The KEK version new data keys are wrapped with. 0 before the first start.
        Versions:
          type: array
          items:
            $ref: "#/components/schemas/KekVersionStatus"
        ToRewrap:
          type: integer
          format: int64
          description: Data keys still wrapped with a version other than the active one. 0 when re-wrapping is done.
        LoadedVersions:
          type: array
          description: The versions in the keyring file of the server that answered.
          items:
            type: integer
            format: int32
        LastRotatedAt:
          type: string
          format: date-time
        LastExportedAt:
          type: string
          format: date-time
          description: The last `dhow-server keys export`. Absent when the keyring was never exported.
    KekVersionStatus:
      type: object
      additionalProperties: false
      required: [Version, State, DataKeys, Loaded]
      properties:
        Version:
          type: integer
          format: int32
        State:
          type: string
          enum: [pending, active, retiring, retired]
        DataKeys:
          type: integer
          format: int64
        Loaded:
          type: boolean
          description: True when the keyring file of the server that answered holds this version.
        ActivatedAt:
          type: string
          format: date-time
        RetiredAt:
          type: string
          format: date-time
        LastExportedAt:
          type: string
          format: date-time
    Meta:
      type: object
      additionalProperties: false
      required: [Version, Commit, SetupRequired]
      properties:
        Version:
          type: string
          example: v0.1.0
        Commit:
          type: string
          example: 2e39188
        SetupRequired:
          type: boolean
          description: True until the first owner completes setup.
    SetupRequest:
      type: object
      additionalProperties: false
      required: [SetupToken, OwnerName, Email, Password, OrganizationName, OrganizationSlug]
      properties:
        SetupToken:
          type: string
          minLength: 1
          maxLength: 256
        OwnerName:
          type: string
          minLength: 1
          maxLength: 100
        Email:
          type: string
          maxLength: 254
        Password:
          type: string
          maxLength: 1024
          description: 12 to 128 characters. Never returned and never logged.
        OrganizationName:
          type: string
          minLength: 1
          maxLength: 100
        OrganizationSlug:
          type: string
          maxLength: 63
          description: Lowercase letters, digits and single hyphens. Unique among organizations.
        Locale:
          $ref: "#/components/schemas/Locale"
    SetupResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/SetupResult"
    SetupResult:
      type: object
      additionalProperties: false
      required: [User, Organization]
      properties:
        User:
          $ref: "#/components/schemas/User"
        Organization:
          $ref: "#/components/schemas/Organization"
    Locale:
      type: string
      enum: [ar, en]
    User:
      type: object
      additionalProperties: false
      required: [Id, Email, Name, Locale]
      properties:
        Id:
          type: string
          format: uuid
        Email:
          type: string
        Name:
          type: string
        Locale:
          $ref: "#/components/schemas/Locale"
    Role:
      type: string
      enum: [owner, admin, maintainer, developer, viewer]
    Organization:
      type: object
      additionalProperties: false
      required: [Id, Name, Slug, CreatedAt, RequireSecondFactor]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
        Slug:
          type: string
        CreatedAt:
          type: string
          format: date-time
        RequireSecondFactor:
          $ref: "#/components/schemas/SecondFactorRule"
        RequireSecondFactorSince:
          type: string
          format: date-time
          description: When the rule last reached more roles. Absent while the rule is `off`.
        LogRetentionDays:
          type: integer
          minimum: 7
          maximum: 3650
          description: Days this organization keeps its job logs. Absent when it follows the server setting.
    UpdateLogRetentionRequest:
      type: object
      additionalProperties: false
      required: [LogRetentionDays, CurrentFactor]
      properties:
        LogRetentionDays:
          type: integer
          nullable: true
          minimum: 7
          maximum: 3650
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    SecondFactorRule:
      type: string
      enum: [off, admins, everyone]
      description: Who must use two-step verification in the organization.
    UpdateSecondFactorRuleRequest:
      type: object
      additionalProperties: false
      required: [RequireSecondFactor, CurrentFactor]
      properties:
        RequireSecondFactor:
          $ref: "#/components/schemas/SecondFactorRule"
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    OrganizationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Organization"
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 100
    Member:
      type: object
      additionalProperties: false
      required: [UserId, Name, Email, Role, EffectiveRole, JoinedAt, Teams]
      properties:
        UserId:
          type: string
          format: uuid
        Name:
          type: string
        Email:
          type: string
        Role:
          $ref: "#/components/schemas/Role"
        EffectiveRole:
          $ref: "#/components/schemas/Role"
          description: The higher of the direct role and every role the member's teams grant in the organization.
        JoinedAt:
          type: string
          format: date-time
        LastActiveAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            The last time the member used this organization in the dashboard: a signed-in request to one of its
            endpoints, recorded at most once a minute. Present only for callers with `member.manage`, and absent when
            the member has not used the organization since this was added.
        Mfa:
          $ref: "#/components/schemas/MfaState"
          description: The member's strongest second factor. Present only for callers with `member.manage`.
        MfaResetPending:
          type: boolean
          description: An admin reset the member's second factor and the member has not set up a new one yet.
        Teams:
          type: array
          description: >-
            The teams of the organization the member belongs to, by name. It needs `member.read`, like the list itself
            and the teams list, and comes from the same query as the page of members.
          items:
            $ref: "#/components/schemas/MemberTeam"
    MemberTeam:
      type: object
      additionalProperties: false
      required: [Id, Name]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
    MemberListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Member"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [Email, Password]
      properties:
        Email:
          type: string
          maxLength: 254
        Password:
          type: string
          maxLength: 1024
          description: Never returned and never logged.
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/LoginResult"
    LoginResult:
      type: object
      additionalProperties: false
      required: [User, CsrfToken, ExpiresAt]
      properties:
        User:
          $ref: "#/components/schemas/User"
        CsrfToken:
          type: string
          description: Send as the `X-CSRF-Token` header on every non-GET request.
        ExpiresAt:
          type: string
          format: date-time
          description: When the session ends at the latest (absolute timeout).
    MembershipView:
      description: >-
        One organization of the user. `Role` is the effective role: the higher of the direct role and every role the
        user's teams grant there.
      type: object
      additionalProperties: false
      required: [OrganizationId, OrganizationName, OrganizationSlug, Role]
      properties:
        OrganizationId:
          type: string
          format: uuid
        OrganizationName:
          type: string
        OrganizationSlug:
          type: string
        Role:
          $ref: "#/components/schemas/Role"
        SecondFactorDue:
          type: string
          format: date-time
          description: >-
            Present when the organization requires two-step verification for this role and the user has neither TOTP
            nor a passkey. Sensitive actions there answer `SECOND_FACTOR_REQUIRED` from this moment on.
    MeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Me"
    Me:
      type: object
      additionalProperties: false
      required: [User, Memberships, CsrfToken, SessionId, ExpiresAt, CanCreateOrganizations, InstanceOwner, MfaReenrollRequired]
      properties:
        User:
          $ref: "#/components/schemas/User"
        Memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipView"
        CsrfToken:
          type: string
        SessionId:
          type: string
          format: uuid
        ExpiresAt:
          type: string
          format: date-time
        CanCreateOrganizations:
          type: boolean
          description: True when this user may call `POST /organizations`.
        InstanceOwner:
          type: boolean
          description: True when this user owns the server and may manage its settings (`instance.settings.manage`).
        MfaReenrollRequired:
          type: boolean
          description: An admin reset this user's second factor, and a new one is not set up yet.
    SessionView:
      type: object
      additionalProperties: false
      required: [Id, CreatedAt, LastSeenAt, ExpiresAt, UserAgent, IpAddress, Current]
      properties:
        Id:
          type: string
          format: uuid
        CreatedAt:
          type: string
          format: date-time
        LastSeenAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
        UserAgent:
          type: string
        IpAddress:
          type: string
        Current:
          type: boolean
    SessionListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/SessionView"
    RevokedCountResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/RevokedCount"
    RevokedCount:
      type: object
      additionalProperties: false
      required: [Revoked]
      properties:
        Revoked:
          type: integer
          minimum: 0
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [CurrentPassword, NewPassword]
      properties:
        CurrentPassword:
          type: string
          maxLength: 1024
        NewPassword:
          type: string
          maxLength: 1024
          description: 12 to 128 characters.
    AuditEvent:
      type: object
      additionalProperties: false
      required: [Id, CreatedAt, Action, TargetType, TargetId, Ip, Data]
      properties:
        Id:
          type: string
          format: uuid
        CreatedAt:
          type: string
          format: date-time
        OrganizationId:
          type: string
          format: uuid
        ActorUserId:
          type: string
          format: uuid
        Action:
          type: string
          example: auth.login
        TargetType:
          type: string
        TargetId:
          type: string
        Ip:
          type: string
        Data:
          type: object
          additionalProperties:
            type: string
          description: Context of the event. Never contains a secret.
    AuditCategory:
      type: string
      enum: [auth, identity, runner, job, system]
    AuditEventResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/AuditEvent"
    AuditEventListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"
    AuditVerifyResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/AuditVerifyResult"
    AuditVerifyResult:
      type: object
      additionalProperties: false
      required: [Valid, Checked]
      properties:
        Valid:
          type: boolean
        Checked:
          type: integer
          minimum: 0
        FirstBrokenId:
          type: string
          format: uuid
    MfaMethod:
      type: string
      enum: [totp, recovery_code, passkey]
    FactorMethod:
      type: string
      enum: [password, totp, recovery_code, passkey]
    WebAuthnJson:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      description: >-
        A W3C WebAuthn JSON structure (`PublicKeyCredentialCreationOptionsJSON`, `PublicKeyCredentialRequestOptionsJSON`
        or the `toJSON()` form of a `PublicKeyCredential`). It keeps the camelCase names of the WebAuthn specification,
        the only place where the API does not use PascalCase.
    MfaPending:
      type: object
      additionalProperties: false
      required: [Methods, ExpiresAt]
      properties:
        Methods:
          type: array
          items:
            $ref: "#/components/schemas/MfaMethod"
          description: The second factors this account can use.
        ExpiresAt:
          type: string
          format: date-time
    MfaPendingResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MfaPending"
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required: [Method]
      properties:
        Method:
          $ref: "#/components/schemas/MfaMethod"
        Code:
          type: string
          maxLength: 64
          description: The TOTP code or the recovery code. Never logged.
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
    PasskeyOptions:
      type: object
      additionalProperties: false
      required: [Options, ExpiresAt]
      properties:
        Options:
          $ref: "#/components/schemas/WebAuthnJson"
        ExpiresAt:
          type: string
          format: date-time
    PasskeyOptionsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/PasskeyOptions"
    PasskeyChallenge:
      type: object
      additionalProperties: false
      required: [ChallengeId, Options, ExpiresAt]
      properties:
        ChallengeId:
          type: string
          format: uuid
        Options:
          $ref: "#/components/schemas/WebAuthnJson"
        ExpiresAt:
          type: string
          format: date-time
    PasskeyChallengeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/PasskeyChallenge"
    PasskeyLoginRequest:
      type: object
      additionalProperties: false
      required: [ChallengeId, Credential]
      properties:
        ChallengeId:
          type: string
          format: uuid
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
    CurrentFactor:
      type: object
      additionalProperties: false
      required: [Method]
      description: >-
        Proof of a factor the user already has. `password` is accepted only while the account has no second factor;
        afterwards one of `totp`, `recovery_code` or `passkey` is required. A wrong factor answers
        `INVALID_CURRENT_FACTOR` and is throttled like a sign-in attempt.
      properties:
        Method:
          $ref: "#/components/schemas/FactorMethod"
        Password:
          type: string
          maxLength: 1024
        Code:
          type: string
          maxLength: 64
        ChallengeId:
          type: string
          format: uuid
          description: From `POST /me/mfa/passkey-options`, for method `passkey`.
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
    CurrentFactorRequest:
      type: object
      additionalProperties: false
      required: [CurrentFactor]
      properties:
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    MfaStatus:
      type: object
      additionalProperties: false
      required: [Enabled, TotpEnabled, RecoveryCodesRemaining, PasskeyCount]
      properties:
        Enabled:
          type: boolean
