  /organizations/{id}/projects/{projectId}/environments/{environmentName}/targets/{targetName}/generate-key:
    post:
      operationId: generateDeployTargetKey
      tags: [targets]
      summary: Make the deploy key of a target
      description: >-
        Needs `environment.manage` and a fresh `CurrentFactor`. Dhow makes an ed25519 key pair and keeps the private half as the secret
        `<TARGET>_SSH_KEY` of the environment. The answer carries only the public half in `PublicKey`, to put in `authorized_keys` on every
        host. Doing it again makes a new key and a new version of that secret. If the environment already has a secret with that name that this target did not make, the answer is 409 `TARGET_KEY_NAME_TAKEN` and nothing is written.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/TargetName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentFactorRequest"
      responses:
        "200":
          description: The target, with the public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployTargetResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/targets/{targetName}/check:
    get:
      operationId: getDeployTargetCheck
      tags: [targets]
      summary: Read the last check of every host of a deploy target
      description: >-
        Needs `project.read`. For each host of the target, in order, the answer says whether a check has run and what it found: `Reason` is
        `ok`, or `host_key_mismatch`, `unreachable`, `auth_failed`, `path_missing`, `current_not_symlink`, `state_corrupt`, `disk_low`,
        `locked` or `diverged`. It also gives the release `current` points to, the last release that passed its health check, the free disk
        space, and whether the state of Dhow for this host was written from this check (`Repaired`). A host that was never checked has
        `Checked` false and no other fact.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/TargetName"
      responses:
        "200":
          description: The last check of every host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployTargetCheckResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startDeployTargetCheck
      tags: [targets]
      summary: Check a deploy target
      description: >-
        Needs `deployment.check`. Starts a run of one job that runs the official deploy plugin in `check` mode on the target. The run
        goes through the same gate as any deployment: the rules of the environment, its lock, approvals, and the secrets and egress that
        the server computes. The plugin connects to every host with the pinned host key and reads `current`, the last release that passed
        its health check, the free disk space and the lock, and changes nothing on the host. The answer is 202 with the number of the run;
        read the result with GET on this path once the run ends. A host whose release was left `unknown` by a runner that died is
        written from what the check found. Answers 503 `TARGET_CHECK_UNAVAILABLE` when this build of the server has no pinned image of
        the plugin.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/TargetName"
      responses:
        "202":
          description: The check run was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployTargetCheckStartedResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/targets/{targetName}/hosts:
