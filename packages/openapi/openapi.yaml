    get:
      operationId: listDeployTargets
      tags: [targets]
      summary: List the deploy targets of an environment
      description: >-
        Needs `project.read` on the project. Each target shows its hosts, whether every host key is pinned (`Ready`) and the public half
        of its deploy key. No private key, and no secret value, is ever in an answer.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of targets.
          content:
            application/json:
