            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentResponse"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateEnvironment
      tags: [environments]
      summary: Change the description or the protection rules of an environment
      description: >-
        Needs `environment.manage` on the project and a fresh `CurrentFactor`. Changes only the fields that are sent.
        `Version` is the one the caller read: an older one answers 409 `ENVIRONMENT_VERSION_CONFLICT` and changes
        nothing. Any change to the rules or the reviewers raises `RuleVersion`, so an approval given before it no longer
        counts. A Maintainer may pause an environment but never change its rules.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
