    post:
      operationId: removeEnvironment
      tags: [environments]
      summary: Remove an environment
      description: >-
        Needs `environment.manage` on the project and a fresh `CurrentFactor`. The environment and its reviewers are
        marked deleted and its name can be used again. A job that still names it fails with `ENVIRONMENT_NOT_FOUND`.
      security:
        - SessionCookie: []
          CsrfToken: []
