        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/secrets/{secretName}/restore-version:
    post:
      operationId: restoreOrganizationSecretVersion
      tags: [secrets]
      summary: Restore an earlier version of a secret of the organization
      description: >-
        Needs `org.secret.manage`. Writes the value of an earlier version as a new version. A version whose value
