      summary: Allow deploys to a paused environment again
      description: >-
        Needs `environment.manage` on the project and a fresh `CurrentFactor`, so a Maintainer who paused cannot resume.
        Resuming an environment that is not paused changes nothing. Raises `RuleVersion`.
      security:
        - SessionCookie: []
          CsrfToken: []
