    post:
      operationId: fetchDeployTargetHostKey
      tags: [targets]
      summary: Fetch the host key from the server
      description: >-
        Needs `environment.manage`. Dhow makes an SSH handshake with the host, without any login, and keeps the key it presents as the
        pending key of that host. It pins nothing. A private, loopback or cloud metadata address is 422 `TARGET_HOST_BLOCKED`: paste the key
        instead. A host that does not answer is 502 `TARGET_HOST_UNREACHABLE`.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/TargetName"
        - $ref: "#/components/parameters/TargetHostId"
      responses:
        "200":
          description: The target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployTargetResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/targets/{targetName}/hosts/{hostId}/pending-host-key:
    put:
      operationId: setDeployTargetPendingHostKey
      tags: [targets]
      summary: Paste the host key of a host
      description: >-
        Needs `environment.manage`. `HostKey` is a line of `ssh-keyscan` or the content of a `.pub` file. It becomes the pending key of the
        host and pins nothing. Only ssh-ed25519, ecdsa and ssh-rsa keys are accepted, and ed25519 is chosen when several are pasted.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/TargetName"
        - $ref: "#/components/parameters/TargetHostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDeployTargetPendingHostKeyRequest"
      responses:
        "200":
          description: The target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployTargetResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/environments/{environmentName}/targets/{targetName}/hosts/{hostId}/confirm-host-key:
    post:
      operationId: confirmDeployTargetHostKey
      tags: [targets]
      summary: Pin the pending host key of a host
      description: >-
        Needs `environment.manage` and a fresh `CurrentFactor`. `Fingerprint` must be the `SHA256:` one of the pending key, as the target
        showed it, or the answer is 409 `HOST_KEY_FINGERPRINT_MISMATCH`. Without a pending key it is 409 `HOST_KEY_NOT_PENDING`. A key that
        changes on the server stays pending while the pinned key keeps working. Dhow never pins a key by itself.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentName"
        - $ref: "#/components/parameters/TargetName"
        - $ref: "#/components/parameters/TargetHostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDeployTargetHostKeyRequest"
      responses:
        "200":
          description: The target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployTargetResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs/{runId}/approvals:
    get:
      operationId: listRunApprovals
      tags: [environments]
      summary: List the approval requests of a run
      description: >-
        Needs `run.read` on the project. One request per environment and round of the run, oldest first, with its
        decision. A comment or bypass reason is shown as written.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The approval requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentApprovalListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs/{runId}/approvals/{approvalId}/approve:
    post:
      operationId: approveDeployment
      tags: [environments]
      summary: Approve a deploy
      description: >-
        Needs `deployment.approve` on the project, a reviewer of the environment with the Developer role or above, and a
        second factor in `CurrentFactor` (an app code, a recovery code or a passkey; a password answers 403
        `REVIEWER_NEEDS_SECOND_FACTOR`). Unless the environment allows self-approval, the user who started the run, or
        whose linked GitHub or GitLab login pushed it, answers 403 `SELF_REVIEW_NOT_ALLOWED`. A request that is not
        pending, has expired or was made under older rules answers 409 `APPROVAL_NOT_PENDING`.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideDeploymentRequest"
      responses:
        "200":
          description: The decided request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentApprovalResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs/{runId}/approvals/{approvalId}/reject:
    post:
      operationId: rejectDeployment
      tags: [environments]
      summary: Reject a deploy
      description: >-
        The same rules as approving. The jobs of the run waiting on this environment fail with `DEPLOYMENT_REJECTED`, and
        the jobs after them are skipped.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideDeploymentRequest"
      responses:
        "200":
          description: The decided request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentApprovalResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/projects/{projectId}/runs/{runId}/approvals/{approvalId}/bypass:
    post:
      operationId: bypassDeployment
      tags: [environments]
      summary: Bypass the reviewers and the wait timer
      description: >-
        Needs `environment.bypass` on the project (Admin and Owner), an environment with `AllowAdminBypass` (403
        `BYPASS_NOT_ALLOWED` otherwise), a `Reason` and a second factor. Skips the reviewers and the wait timer only: the
        ref rule, the pinned images and plugins, and the pause still apply.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BypassDeploymentRequest"
      responses:
        "200":
          description: The decided request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentApprovalResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/deployment-approvals:
    get:
      operationId: listPendingApprovals
      tags: [environments]
      summary: List the deploys waiting for approval
      description: >-
        Pending requests of the projects whose runs you can read (`run.read`), oldest first. With `Mine=true`, only the
        requests you may decide: you are a reviewer of the environment, and not the one who started the run when the
        environment refuses self-approval.
