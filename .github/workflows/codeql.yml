name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Changed areas
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
      web: ${{ steps.scope.outputs.web }}
      actions: ${{ steps.scope.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide which areas the change touches
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: deploy/ci/changed-areas.sh "$EVENT" >> "$GITHUB_OUTPUT"

  analyze:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.web == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, actions, javascript-typescript]
    steps:
      - name: Decide whether this language changed
        id: lang
        env:
          LANGUAGE: ${{ matrix.language }}
          CODE: ${{ needs.changes.outputs.code }}
          WEB: ${{ needs.changes.outputs.web }}
          ACTIONS: ${{ needs.changes.outputs.actions }}
        run: |
          case "$LANGUAGE" in
            go) run=$CODE ;;
            javascript-typescript) run=$WEB ;;
            actions) run=$ACTIONS ;;
            *) run=true ;;
          esac
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.lang.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.lang.outputs.run == 'true' && matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.lang.outputs.run == 'true'
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.lang.outputs.run == 'true' && matrix.language == 'go'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.lang.outputs.run == 'true'
