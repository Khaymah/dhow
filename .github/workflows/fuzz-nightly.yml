name: Fuzz nightly

on:
  schedule:
    - cron: "43 0 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz each target
        required: false
        default: 30m
        type: choice
        options: [30m, 10m, 1m]

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  targets:
    name: List the fuzz targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read FUZZ_TARGETS and RUNNER_FUZZ from the Makefile
        id: list
        run: echo "targets=$(make --no-print-directory fuzz-list)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Name the crasher folder
        id: where
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "dir=${TARGET%%:*}/testdata/fuzz/${TARGET##*:}" >> "$GITHUB_OUTPUT"
          echo "name=crashers-$(printf '%s' "$TARGET" | tr '/:' '--')" >> "$GITHUB_OUTPUT"
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || '30m' }}
        run: make fuzz-one FUZZ_TARGET="$TARGET" FUZZTIME="$FUZZTIME"
      - name: Keep the crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.where.outputs.name }}
          path: ${{ steps.where.outputs.dir }}
          if-no-files-found: warn
          retention-days: 30
