name: Demo

on:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/server/**
      - apps/runner/**
      - internal/**
      - packages/proto/**
      - deploy/dev/**
      - deploy/dhow-git/**
      - deploy/m3-demo/**
      - deploy/m4-demo/**
      - deploy/m5-demo/**
      - deploy/e2e/**
      - deploy/e2e-targets/**
      - apps/plugins/**
      - deploy/ci/demo-areas.sh
      - apps/web/**
      - packages/openapi/**
      - go.mod
      - go.sum
      - .github/workflows/demo.yml

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Changed areas
    runs-on: ubuntu-24.04
    outputs:
      demos: ${{ steps.scope.outputs.demos }}
      e2e: ${{ steps.scope.outputs.e2e }}
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide which demos the change needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: deploy/ci/demo-areas.sh "$EVENT" >> "$GITHUB_OUTPUT"

  demo:
    needs: changes
    if: needs.changes.outputs.demos == 'true'
    name: ${{ matrix.demo }} on a clean Ubuntu 26.04 with Docker
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        demo: [m3-demo, m4-demo, m5-demo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No secret of the demo helpers reaches the argv of a process
        run: bash deploy/m4-demo/secrets-argv-test.sh
      - name: Let rootless Podman in the runner container make user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the demo
        env:
          DEMO: ${{ matrix.demo }}
        run: bash "deploy/$DEMO/run.sh"

  deploy-e2e:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    name: Deploy to a real sshd with the dhow-deploy-ssh plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhow
          POSTGRES_PASSWORD: dhow-ci-only
          POSTGRES_DB: dhow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DHOW_TEST_DATABASE_URL: postgres://dhow:dhow-ci-only@localhost:5432/dhow_test?sslmode=disable # allow-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the plugin image from the Dockerfile that is released
        run: make deploy-ssh-image DEPLOY_SSH_IMAGE=dhow-deploy-ssh:ci
      - name: Check that the image carries its manifest, runs as the nonroot user and refuses to start without a target
        run: |
          docker image inspect dhow-deploy-ssh:ci --format '{{ index .Config.Labels "io.dhow.plugin.manifest" }}' | grep -q '"Mutating":true'
          test "$(docker image inspect dhow-deploy-ssh:ci --format '{{ .Config.User }}')" = 65532:65532
          set +e
          docker run --rm --network none dhow-deploy-ssh:ci 2> stderr.txt
          code=$?
          set -e
          test "$code" = 2
          grep -q PLUGIN_INPUT_INVALID stderr.txt
      - name: Build the compose plugin image from the Dockerfile that is released
        run: make deploy-compose-image DEPLOY_COMPOSE_IMAGE=dhow-deploy-compose:ci
      - name: Check that the compose image carries its manifest, runs as the nonroot user and refuses to start without a target
        run: |
          docker image inspect dhow-deploy-compose:ci --format '{{ index .Config.Labels "io.dhow.plugin.manifest" }}' | grep -q '"Mutating":true'
          test "$(docker image inspect dhow-deploy-compose:ci --format '{{ .Config.User }}')" = 65532:65532
          set +e
          docker run --rm --network none dhow-deploy-compose:ci 2> stderr.txt
          code=$?
          set -e
          test "$code" = 2
          grep -q PLUGIN_INPUT_INVALID stderr.txt
      - name: Deploy to the sshd and to the Docker hosts, and replay the reports into the server
        run: make deploy-e2e

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    name: Browser tests (Playwright) on a real server, Forgejo and a Podman runner
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Enable pnpm from the packageManager field, also outside apps/web
        run: |
          corepack enable
          corepack install --global "$(node -p "require('./apps/web/package.json').packageManager")"
      - name: Build the web app into the server
        run: make web
      - name: Install Chromium for the pinned Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Let rootless Podman in the runner container make user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the browser tests
        run: bash deploy/e2e/run.sh
      - name: Keep the traces and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            apps/web/E2E/Results
            apps/web/E2E/Report
          if-no-files-found: ignore
          retention-days: 7
