secrets:
  dhow-keyring:
    file: ${BENCH_KEYRING_FILE:?the bench writes the keyring}

services:
  postgres:
    image: ${BENCH_POSTGRES_IMAGE:-postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42}
    restart: "no"
    mem_limit: ${BENCH_DB_MEMORY:-2g}
    memswap_limit: ${BENCH_DB_MEMORY:-2g}
    cpus: ${BENCH_DB_CPUS:-2.0}

  dhow:
    restart: "no"
    mem_limit: ${BENCH_SERVER_MEMORY:-2g}
    memswap_limit: ${BENCH_SERVER_MEMORY:-2g}
    cpus: ${BENCH_SERVER_CPUS:-2.0}
