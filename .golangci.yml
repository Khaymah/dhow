version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - forbidigo
    - funlen
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^(\w+\.)?NewSealer$'
          pkg: '^github\.com/Khaymah/dhow/apps/server/internal/Core/Crypto$'
          msg: seal new values with Core/Keys (keys.Values.Column); NewSealer only reads the old format in Core/Keys/Values.go (ADR-0082)
    gosec:
      excludes: []
    nolintlint:
      require-explanation: true
      require-specific: true
    funlen:
      lines: 100
      statements: -1
      ignore-comments: false
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 500
              skipComments: false
              skipBlankLines: false
  exclusions:
    generated: strict
    presets:
      - comments
    rules:
      - path: _test\.go
        linters: [gosec, unparam, noctx, forbidigo]
      - path: apps/server/internal/Core/(Crypto/|Keys/Values\.go)
        linters: [forbidigo]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/Khaymah/dhow]
